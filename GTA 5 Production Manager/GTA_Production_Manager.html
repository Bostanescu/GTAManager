<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Production Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* ======================================================================
   Tokens
   Night dispatch board: asphalt blues, sodium-streetlight amber,
   game-style 5-segment supply bars.
   ====================================================================== */
:root {
  --asphalt: #121820;
  --panel: #1b232d;
  --panel-2: #232d39;
  --steel: #34404f;
  --line: #3b4757;
  --text: #ece6da;
  --muted: #a5adb7;
  --sodium: #f2a93b;
  --sodium-ink: #1d1404;
  --ok: #3fcaa6;
  --warn: #f2a93b;
  --bad: #ff6464;
  --full: #6fb4ff;
  --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --body: 'Barlow', 'Segoe UI', system-ui, sans-serif;
  --side-w: 300px;
  --head-h: 56px;
  --ease: cubic-bezier(.2, .8, .2, 1);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--asphalt);
  color: var(--text);
  font: 15px/1.45 var(--body);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--sodium); outline-offset: 2px; }
@media (max-width: 430px) {
  header h1 { display: none; }     /* phones: the controls need the room */
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; transition-duration: .001s !important; }
}

/* ======================================================================
   Header
   ====================================================================== */
header {
  position: fixed;
  inset: 0 0 auto 0;
  height: var(--head-h);
  padding: 0 12px;
  padding-top: env(safe-area-inset-top, 0px);
  display: flex;
  align-items: center;
  gap: 12px;
  background: linear-gradient(#0d1218, #10161d);
  border-bottom: 1px solid var(--line);
  z-index: 50;
}
.icon-btn {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--panel);
  font-size: 18px;
  line-height: 1;
}
.icon-btn:hover { background: var(--panel-2); }
header h1 {
  margin: 0;
  font: 700 24px/1 var(--display);
  letter-spacing: .02em;
  white-space: nowrap;
}
.head-spacer { flex: 1; }
.lang-sel {
  height: 38px;
  padding: 0 8px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--panel);
  font-weight: 600;
  cursor: pointer;
}

/* In-game switch: the one control that drives every timer */
.ingame {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 12px 5px 6px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--panel);
  user-select: none;
}
.ingame .track {
  position: relative;
  width: 44px;
  height: 24px;
  border-radius: 999px;
  background: var(--steel);
  transition: background .25s var(--ease);
}
.ingame .track::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--text);
  transition: transform .25s var(--ease);
}
.ingame.on { border-color: color-mix(in srgb, var(--ok) 60%, var(--line)); }
.ingame.on .track { background: var(--ok); }
.ingame.on .track::after { transform: translateX(20px); }
.ingame .lbl { font: 600 15px/1.1 var(--display); letter-spacing: .02em; }
.ingame .sub { display: block; font: 400 12px/1.1 var(--body); color: var(--muted); }
.ingame.on .sub { color: var(--ok); }

.head-stat { text-align: right; line-height: 1.15; }
.head-stat b { display: block; font: 700 18px/1.1 var(--display); }
.head-stat small { color: var(--muted); font-size: 12px; }

/* menu */
.menu { position: relative; }
.menu-list {
  position: absolute;
  right: 0;
  top: calc(100% + 6px);
  width: 250px;
  padding: 6px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--panel);
  box-shadow: 0 16px 40px rgba(0,0,0,.5);
  display: none;
}
.menu.open .menu-list { display: block; }
.menu-list button, .menu-list label {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 8px 10px;
  border: 0;
  border-radius: 6px;
  background: none;
  text-align: left;
  font-size: 14px;
  cursor: pointer;
}
.menu-list button:hover, .menu-list label:hover { background: var(--panel-2); }
.menu-list hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
.menu-list select { margin-left: auto; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }

/* ======================================================================
   Sidebar with category tiles
   ====================================================================== */
#sidebar {
  position: fixed;
  top: var(--head-h);
  bottom: 0;
  left: 0;
  width: var(--side-w);
  padding: 14px 12px 20px;
  background: linear-gradient(180deg, #151c25, #121820);
  border-right: 1px solid var(--line);
  overflow-y: auto;
  overflow-x: visible;
  z-index: 40;
  transition: transform .35s var(--ease);
}
body.side-closed #sidebar { transform: translateX(calc(-1 * var(--side-w) - 2px)); }

.tile {
  position: relative;
  height: 112px;
  margin-bottom: 12px;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--line);
  cursor: pointer;
  isolation: isolate;
  transition: border-color .2s, transform .2s var(--ease);
}
.tile:hover, .tile.open { border-color: var(--sodium); }
.tile .tile-text {
  position: absolute;
  left: 14px;
  bottom: 12px;
  right: 80px;
  z-index: 2;
}
.tile h2 { margin: 0; font: 700 26px/1 var(--display); letter-spacing: .01em; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
.tile .tile-sub { font-size: 13px; color: #e2dccf; opacity: .85; text-shadow: 0 1px 6px rgba(0,0,0,.7); }
.tile .tile-dots { position: absolute; bottom: 14px; right: 12px; display: flex; gap: 4px; z-index: 2; }
.tile .tile-dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--steel); box-shadow: 0 0 0 2px rgba(0,0,0,.35); }
.tile .tile-dots i.ok { background: var(--ok); }
.tile .tile-dots i.low { background: var(--warn); }
.tile .tile-dots i.empty { background: var(--bad); }
.tile .tile-dots i.full { background: var(--full); }
.tile.locked { cursor: default; filter: saturate(.25) brightness(.7); }
.tile.locked:hover { border-color: var(--line); }
.tile .soon {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 2;
  font-size: 12px;
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(0,0,0,.55);
  color: var(--muted);
}

/* Category artwork: each tile paints its own scene in CSS */
.art { position: absolute; inset: 0; z-index: 0; }
.art::after { /* readable text: darken the lower part */
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,.65));
}
/* Emblem tiles: the artwork on black, title on a dark band underneath */
.tile.emblem { height: 176px; }
.tile.emblem .art {
  background:
    var(--emb) center 7px / auto 106px no-repeat,
    radial-gradient(90% 70% at 50% 30%, var(--emb-glow) 0%, transparent 70%),
    #070707;
}
.tile.emblem .art::after { background: linear-gradient(180deg, rgba(0,0,0,0) 60%, rgba(0,0,0,.9) 68%, #000 100%); }
.tile.emblem .tile-text { bottom: 10px; right: 14px; }
.tile.emblem.locked .tile-text, .tile.emblem:not([data-cat="mc"]) .tile-text { right: 14px; }
.tile[data-cat="mc"].emblem .tile-text { right: 76px; }
.tile.emblem h2, .tile.emblem .tile-sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.emblem h2 { font-size: 22px; line-height: 1.05; color: #f3ede2; }
.tile.emblem .tile-sub { opacity: 1; color: #cfc8bc; font-size: 12.5px; }
.tile.emblem .tile-dots { bottom: 16px; }
/* not available yet: keep the colors, just quieter */
.tile.emblem.locked { filter: none; }
.tile.emblem.locked .art { opacity: .55; transition: opacity .25s; }
.tile.emblem.locked:hover .art { opacity: .8; }
.tile.emblem.locked h2 { color: #bdb6aa; }

.art-mc .beam {
  position: absolute;
  top: -40%;
  left: -60%;
  width: 60%;
  height: 180%;
  background: linear-gradient(90deg, transparent, rgba(255,214,150,.20), transparent);
  transform: rotate(18deg);
  animation: sweep 6s ease-in-out infinite;
}
@keyframes sweep { 0%, 55% { left: -60%; } 85%, 100% { left: 130%; } }
.art-bunker { background: repeating-linear-gradient(45deg, #3a3f2c 0 10px, #33382a 10px 20px); }
.art-acid { background: radial-gradient(60% 80% at 20% 30%, #3f6b2a, transparent 70%), linear-gradient(135deg, #1e2a17, #121a0e); }

/* Fly-out tabs (one per business), anchored to the right of the tile */
#flyout {
  position: fixed;
  z-index: 45;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 4px 4px 4px 10px; /* left padding bridges the gap to the tile */
  pointer-events: none;
}
#flyout.show { pointer-events: auto; }
.tab {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 208px;
  min-height: 44px;
  padding: 6px 10px 6px 6px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,.12);
  color: #fff;
  text-align: left;
  box-shadow: 0 8px 22px rgba(0,0,0,.45);
  opacity: 0;
  transform: translateX(-14px);
  transition: opacity .18s ease, transform .22s var(--ease), border-color .15s;
}
#flyout.show .tab { opacity: 1; transform: none; }
#flyout.show .tab:nth-child(2) { transition-delay: .03s; }
#flyout.show .tab:nth-child(3) { transition-delay: .06s; }
#flyout.show .tab:nth-child(4) { transition-delay: .09s; }
#flyout.show .tab:nth-child(5) { transition-delay: .12s; }
#flyout.show .tab:nth-child(6) { transition-delay: .15s; }
.tab:hover, .tab.hot { border-color: rgba(255,255,255,.55); }
.tab .tab-bar { margin-left: auto; }
.tab .ico { width: 32px; height: 32px; flex: 0 0 32px; }
.tab .tab-name { font: 600 17px/1.05 var(--display); letter-spacing: .01em; }
.tab .tab-state { display: block; font-size: 12px; opacity: .85; }


/* business colors */
.c-club     { background: linear-gradient(120deg, #6b2f15, #3a1a0e); }
.c-weed     { background: linear-gradient(120deg, #2f6b25, #183a14); }
.c-cash     { background: linear-gradient(120deg, #4f6b2a, #2a3a16); }
.c-coke     { background: linear-gradient(120deg, #4b5c74, #252f3d); }
.c-docs     { background: linear-gradient(120deg, #6b5a35, #3a301b); }
.c-meth     { background: linear-gradient(120deg, #23657a, #11343f); }

/* 5-segment bar, like the game's supply bar */
.seg5 { display: inline-flex; gap: 2px; }
.seg5 i { width: 7px; height: 12px; border-radius: 2px; background: rgba(255,255,255,.18); }
.seg5 i.on { background: var(--ok); }
.seg5.low i.on { background: var(--warn); }
.seg5.empty i { background: rgba(255,100,100,.35); }

/* ======================================================================
   Map
   ====================================================================== */
#map {
  position: fixed;
  top: var(--head-h);
  right: 0;
  bottom: 0;
  left: var(--side-w);
  overflow: hidden;
  background: #0b2a43;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  cursor: grab;
  transition: left .35s var(--ease);
  outline: none;
}
body.side-closed #map { left: 0; }
#map.dragging { cursor: grabbing; }
#map.placing { cursor: crosshair; }
#map:focus-visible { outline: 2px solid var(--sodium); outline-offset: -2px; }
.pin-ghost {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 7;
  pointer-events: none;
  opacity: 0;
  transition: opacity .12s;
}
.pin-ghost.show { opacity: .9; }
.pin-ghost .pin-disc { width: 40px; height: 40px; transform: translate(-50%, -50%); filter: drop-shadow(0 6px 10px rgba(0,0,0,.6)); }
.pin-ghost .ico { position: absolute; inset: 0; border-radius: 50%; outline: 3px dashed var(--sodium); outline-offset: 3px; }
/* zoomed far out: names only on hover / selection, so pins don't turn into a pile of labels */
#map.far .pin-label { opacity: 0; transform: translateY(-4px); transition: opacity .15s, transform .15s; pointer-events: none; }
#map.far .pin:hover .pin-label, #map.far .pin.selected .pin-label, #map.far .pin.alert .pin-label { opacity: 1; transform: none; }
.pin:hover { z-index: 3; }
#world {
  position: absolute;
  left: 0;
  top: 0;
  transform-origin: 0 0;
  will-change: transform;
  backface-visibility: hidden;
}
#world img { display: block; user-select: none; -webkit-user-drag: none; pointer-events: none; }
#pins { position: absolute; inset: 0; }

.map-tools {
  position: absolute;
  right: 12px;
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 5;
}
.map-tools .icon-btn { background: rgba(27,35,45,.92); }

.place-hint {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  padding: 8px 14px;
  border-radius: 999px;
  background: var(--sodium);
  color: var(--sodium-ink);
  font-weight: 600;
  z-index: 6;
  display: none;
  white-space: nowrap;
}
#map.placing .place-hint { display: block; }

.map-loading {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--muted);
  font: 600 18px var(--display);
}

/* Pin: icon disc + stock ring, supply segments under it, label */
.pin {
  position: absolute;
  width: 0;
  height: 0;
  z-index: 2;
}
.pin-body {
  position: absolute;
  left: 0;
  top: 0;
  /* the map point sits at the center of the disc, not of the whole pin */
  transform: translate(-50%, -23px) scale(var(--inv, 1));
  transform-origin: 50% 23px;
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
}
.pin-disc {
  position: relative;
  width: 46px;
  height: 46px;
}
.pin-disc svg.ring { position: absolute; inset: 0; transform: rotate(-90deg); }
.pin-disc .ico {
  position: absolute;
  inset: 6px;
  border-radius: 50%;
  box-shadow: 0 3px 10px rgba(0,0,0,.6);
}
.pin .seg5 { margin-top: 3px; padding: 2px 3px; border-radius: 4px; background: rgba(10,14,20,.8); }
.pin .seg5 i { width: 6px; height: 7px; }
.pin-label {
  margin-top: 2px;
  padding: 1px 6px;
  border-radius: 4px;
  background: rgba(10,14,20,.8);
  font: 600 13px/1.3 var(--display);
  white-space: nowrap;
}
.pin.alert .pin-disc::before {
  content: "";
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 3px solid var(--alert-c, var(--warn));
  animation: pulse 1.1s ease-out infinite;
}
.pin.alert.a-empty { --alert-c: var(--bad); }
.pin.alert.a-full, .pin.alert.a-nearfull { --alert-c: var(--full); }
.pin.alert.a-ready { --alert-c: var(--ok); }
@keyframes pulse {
  0% { transform: scale(.85); opacity: 1; }
  100% { transform: scale(1.6); opacity: 0; }
}
.pin.selected .pin-label { background: var(--sodium); color: var(--sodium-ink); }

/* ======================================================================
   Business window
   ====================================================================== */
#win {
  position: fixed;
  top: calc(var(--head-h) + 12px);
  right: 12px;
  width: 360px;
  max-height: calc(100% - var(--head-h) - 24px);
  display: flex;
  flex-direction: column;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--panel);
  box-shadow: 0 24px 60px rgba(0,0,0,.55);
  z-index: 60;
  opacity: 0;
  transform: translateX(20px);
  pointer-events: none;
  transition: opacity .2s ease, transform .25s var(--ease);
}
#win.open { opacity: 1; transform: none; pointer-events: auto; }
.win-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 14px 12px;
  border-radius: 14px 14px 0 0;
}
.win-head .ico { width: 40px; height: 40px; flex: 0 0 40px; }
.win-head h3 { margin: 0; font: 700 24px/1 var(--display); }
.win-head small { display: block; color: #e8e2d6; opacity: .85; font-size: 13px; }
.win-head .icon-btn { margin-left: auto; background: rgba(0,0,0,.3); border-color: rgba(255,255,255,.15); }
.win-body { padding: 4px 16px 16px; overflow-y: auto; }

.row { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
.row > .grow { flex: 1; }
.sect { margin-top: 18px; }
.sect h4 { margin: 0 0 8px; font: 600 17px/1.1 var(--display); letter-spacing: .02em; color: var(--text); }
.hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }

.toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.toggle input { appearance: none; width: 36px; height: 20px; border-radius: 999px; background: var(--steel); position: relative; margin: 0; cursor: pointer; transition: background .2s; }
.toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--text); transition: transform .2s var(--ease); }
.toggle input:checked { background: var(--sodium); }
.toggle input:checked::after { transform: translateX(16px); }

.chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  font-size: 14px;
}
.chip.on { border-color: var(--sodium); background: color-mix(in srgb, var(--sodium) 18%, var(--panel-2)); }

.btn {
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  font-size: 14px;
}
.btn:hover { background: var(--steel); }
.btn.primary { background: var(--sodium); border-color: var(--sodium); color: var(--sodium-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: none; }
.btn.danger { color: var(--bad); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

/* supply picker: 5 big segments */
/* Game-style bars: 5 boxes, each fills gradually. Press and drag across to set. */
.segbar {
  display: flex;
  gap: 4px;
  touch-action: none;
  cursor: pointer;
  user-select: none;
  border-radius: 6px;
}
.segbar .seg {
  position: relative;
  flex: 1;
  height: 26px;
  border-radius: 5px;
  border: 1px solid var(--line);
  background: var(--asphalt);
  overflow: hidden;
}
.segbar .seg i {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0;
  background: var(--seg-c);
  box-shadow: inset 0 -6px 10px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.25);
  transition: width .18s var(--ease);
}
.segbar.dragging .seg i { transition: none; }
.segbar .seg::after { /* unit dividers inside each box */
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(90deg, transparent 0 calc(100% / var(--ticks) - 1px), rgba(0,0,0,.35) calc(100% / var(--ticks) - 1px) calc(100% / var(--ticks)));
  pointer-events: none;
}
.segbar.stock { --seg-c: var(--full); }
.segbar.supplies { --seg-c: var(--ok); }
.segbar.supplies.low { --seg-c: var(--warn); }
.segbar.supplies.empty .seg { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); }
.segbar.small .seg { height: 18px; border-radius: 4px; }
.segbar:focus-visible { outline: 2px solid var(--sodium); outline-offset: 3px; }
.bar-cap { display: flex; justify-content: space-between; gap: 8px; margin-top: 5px; font-size: 13px; color: var(--muted); }
.bar-cap b { color: var(--text); font-weight: 600; }

/* Quick panel: third level of the cascade, next to the hovered business */
#quick {
  position: fixed;
  z-index: 46;
  width: 260px;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--panel);
  box-shadow: 0 16px 40px rgba(0,0,0,.55);
  opacity: 0;
  transform: translateX(-10px);
  pointer-events: none;
  transition: opacity .15s ease, transform .2s var(--ease), top .15s var(--ease);
}
#quick.show { opacity: 1; transform: none; pointer-events: auto; }
#quick::before { /* invisible bridge over the gap to the tab */
  content: "";
  position: absolute;
  left: -12px;
  top: 0;
  bottom: 0;
  width: 12px;
}
#quick .q-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
#quick .q-head b { font: 700 19px/1.1 var(--display); }
#quick .q-head .state-badge { margin-left: auto; font-size: 12px; }
#quick .q-label { font: 600 14px/1 var(--display); letter-spacing: .02em; margin: 12px 0 6px; color: var(--text); }
#quick .btn-row { margin-top: 12px; }
#quick .btn { flex: 1; padding: 7px 8px; font-size: 13px; }
#quick .q-note { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
input[type="range"] { width: 100%; accent-color: var(--sodium); }
.big-num { font: 700 22px/1 var(--display); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 14px; }
.kv span:nth-child(odd) { color: var(--muted); }
.kv b { font-weight: 600; text-align: right; }
.state-badge {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
}
.st-ok { background: color-mix(in srgb, var(--ok) 22%, transparent); color: var(--ok); }
.st-low { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
.st-empty { background: color-mix(in srgb, var(--bad) 22%, transparent); color: var(--bad); }
.st-full { background: color-mix(in srgb, var(--full) 22%, transparent); color: var(--full); }
.st-idle { background: var(--panel-2); color: var(--muted); }

details.adv { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 10px; }
details.adv summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.adv-grid { display: grid; grid-template-columns: 1fr 110px; gap: 8px 10px; align-items: center; margin-top: 10px; font-size: 14px; }
.adv-grid input, .num-input {
  width: 100%;
  padding: 6px 8px;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--asphalt);
}
.est { color: var(--warn); font-size: 12px; }

/* toast */
#toast {
  position: fixed;
  left: 50%;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 20px);
  padding: 10px 16px;
  border-radius: 10px;
  border: 1px solid var(--line);
  border-left: 4px solid var(--sodium);
  background: var(--panel);
  box-shadow: 0 12px 30px rgba(0,0,0,.5);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s, transform .25s var(--ease);
  z-index: 80;
  max-width: calc(100vw - 32px);
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ======================================================================
   Help / About page (modal)
   ====================================================================== */
#modal {
  width: min(760px, calc(100vw - 24px));
  max-height: calc(100vh - 40px);
  padding: 0;
  border-radius: 16px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
  box-shadow: 0 30px 80px rgba(0,0,0,.6);
  display: none;
  flex-direction: column;
}
#modal[open] { display: flex; animation: modalIn .25s var(--ease); }
#modal::backdrop { background: rgba(5,8,12,.6); backdrop-filter: blur(3px); }
@keyframes modalIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.modal-head { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
.modal-head h2 { margin: 0; font: 700 28px/1 var(--display); }
.modal-head .icon-btn { margin-left: auto; }
.modal-body { padding: 6px 22px 22px; overflow-y: auto; line-height: 1.55; }
.modal-body h3 { font: 700 21px/1.2 var(--display); margin: 22px 0 6px; color: var(--sodium); }
.modal-body p, .modal-body li { max-width: 68ch; color: #ddd7cb; }
.modal-body ul { padding-left: 20px; margin: 6px 0; }
.modal-body li { margin: 3px 0; }
.modal-body kbd { font: 600 12px var(--body); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); background: var(--asphalt); }
.help-nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 4px; }
.help-nav a { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--text); text-decoration: none; }
.help-nav a:hover { border-color: var(--sodium); }
.version { color: var(--muted); font-size: 14px; margin-top: 10px; }
.log { border-left: 2px solid var(--line); margin: 14px 0 0 4px; padding-left: 16px; }
.log-entry { position: relative; margin-bottom: 18px; }
.log-entry::before { content: ""; position: absolute; left: -22px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--steel); border: 2px solid var(--panel); }
.log-entry:first-child::before { background: var(--sodium); }
.log-entry h4 { margin: 0; font: 700 18px/1.2 var(--display); }
.log-entry h4 small { font: 400 13px var(--body); color: var(--muted); margin-left: 8px; }
.log-entry ul { margin-top: 4px; }

/* toast with an action (Undo) */
#toast { display: flex; align-items: center; gap: 12px; }
#toast .btn { padding: 4px 10px; color: var(--sodium); border-color: color-mix(in srgb, var(--sodium) 45%, var(--line)); pointer-events: auto; }
#toast.show { pointer-events: auto; }
.undo-row { display: flex; gap: 6px; flex-wrap: wrap; }
.btn.small { padding: 5px 9px; font-size: 13px; }

/* ======================================================================
   Notifications: bell + history + fading cards top-right
   ====================================================================== */
.bell { position: relative; color: var(--text); }
.bell .dot {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--sodium);
  box-shadow: 0 0 0 2px #10161d;
  display: none;
}
.bell.unread { color: var(--sodium); }
.bell.unread .dot { display: block; animation: breathe 2.6s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.notes-panel { width: 320px; max-height: 60vh; overflow-y: auto; padding: 8px; }
.notes-head { display: flex; align-items: center; gap: 6px; padding: 2px 4px 8px; }
.notes-head b { font: 700 18px/1 var(--display); margin-right: auto; }
.notes-head button { width: auto; padding: 4px 8px; font-size: 12px; color: var(--muted); }
.nitem {
  display: flex;
  gap: 10px;
  padding: 8px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  line-height: 1.3;
}
.nitem:hover { background: var(--panel-2); }
.nitem .nbar { width: 3px; flex: 0 0 3px; border-radius: 2px; background: var(--c, var(--muted)); }
.nitem small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.nitem.unread { background: color-mix(in srgb, var(--sodium) 8%, transparent); }
.nitem.unread .ntext { font-weight: 600; }
.notes-empty { color: var(--muted); font-size: 14px; padding: 12px 6px; }
.k-warn { --c: var(--warn); } .k-bad { --c: var(--bad); } .k-full { --c: var(--full); } .k-ok { --c: var(--ok); } .k-info { --c: var(--muted); }

#noteStack {
  position: fixed;
  top: calc(var(--head-h) + 10px);
  right: 12px;
  z-index: 90;
  width: 300px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.note {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,.10);
  border-left: 3px solid var(--c);
  background: rgba(22, 29, 38, .72);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 10px 28px rgba(0,0,0,.35);
  font-size: 14px;
  line-height: 1.3;
  cursor: pointer;
  opacity: 0;
  transform: translateY(-8px);
  transition: opacity .5s ease, transform .5s var(--ease);
}
.note.show { opacity: 1; transform: none; }
.note .ico { width: 28px; height: 28px; flex: 0 0 28px; }

/* Clubhouse sections */
.club-sect { margin-top: 12px; padding: 10px; border-radius: 10px; background: var(--asphalt); border: 1px solid var(--line); }
.club-sect h5 { margin: 0 0 6px; display: flex; align-items: center; gap: 8px; font: 600 16px/1.1 var(--display); letter-spacing: .02em; }
.club-sect h5 .bell-tg { margin-left: auto; }
.club-line { font-size: 13px; color: var(--muted); margin-top: 4px; }
.club-line b { color: var(--text); font-weight: 600; }
.club-line.ready b { color: var(--ok); }
.thin { height: 6px; border-radius: 3px; background: var(--steel); overflow: hidden; margin-top: 6px; }
.thin i { display: block; height: 100%; background: var(--sodium); transition: width .4s var(--ease); }
.bell-tg {
  width: 30px;
  height: 26px;
  display: grid;
  place-items: center;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: none;
  color: var(--muted);
  font-size: 13px;
}
.bell-tg[aria-pressed="true"] { color: var(--sodium); border-color: color-mix(in srgb, var(--sodium) 50%, var(--line)); }
.mini-check { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; cursor: pointer; user-select: none; margin-top: 8px; }
.mini-check input { width: 16px; height: 16px; accent-color: var(--sodium); margin: 0; cursor: pointer; }
.club-sect .btn { margin-top: 8px; }
.bag-row {
  margin-top: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  background: var(--panel-2);
}
.bag-line { display: flex; align-items: center; gap: 8px; margin: 2px 0; }
.bag-line .bag-sum { margin-right: auto; }
#quick .bag-line .btn, .bag-line .btn, #quick .undo-row .btn { flex: 0 0 auto; margin-top: 0; }
.bag-sum { font: 700 17px/1.2 var(--display); color: var(--ok); white-space: nowrap; }
.bag-sum.full { color: var(--full); }

/* ======================================================================
   Phones
   ====================================================================== */
@media (max-width: 760px) {
  :root { --side-w: 270px; }
  header { gap: 8px; padding: 0 8px; }
  header h1 { font-size: 18px; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .head-stat { display: none; }
  .head-spacer { flex: 0 0 0; margin-left: auto; }
  .ingame { padding: 4px 10px 4px 5px; gap: 7px; flex: 0 0 auto; }
  .ingame .track { width: 38px; height: 22px; }
  .ingame .track::after { width: 16px; height: 16px; }
  .ingame.on .track::after { transform: translateX(16px); }
  .ingame .lbl { white-space: nowrap; font-size: 14px; }
  .ingame .sub { display: none; }
  #toast { bottom: auto; top: calc(var(--head-h) + 10px); transform: translate(-50%, -10px); }
  #noteStack { left: 10px; right: 10px; width: auto; }
  .lang-sel { appearance: none; -webkit-appearance: none; width: 40px; padding: 0; text-align: center; text-align-last: center; }
  .notes-panel { position: fixed; left: 8px; right: 8px; top: calc(var(--head-h) + 4px); width: auto; }
  #map { left: 0 !important; }
  #sidebar { box-shadow: 12px 0 40px rgba(0,0,0,.5); }
  #win {
    top: auto;
    left: 0;
    right: 0;
    bottom: 0;
    width: auto;
    max-height: 78vh;
    border-radius: 16px 16px 0 0;
    transform: translateY(30px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  #win.open { transform: none; }
  .win-head { border-radius: 16px 16px 0 0; }
  #flyout .tab { width: 190px; }
}
</style>
</head>
<body>

<header>
  <button class="icon-btn" id="sideBtn" data-i18n-aria="toggleMenu" aria-label="Toggle menu" aria-expanded="true">☰</button>
  <h1>Production Manager</h1>
  <div class="head-spacer"></div>
  <div class="head-stat" id="headStat"></div>
  <select id="langSel" class="lang-sel" aria-label="Language / Limbă" title="Language / Limbă">
    <option value="en">EN</option>
    <option value="ro">RO</option>
  </select>
  <div class="menu" id="bellWrap">
    <button class="icon-btn bell" id="bellBtn" aria-label="Notifications" aria-haspopup="true">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 16v-5a6 6 0 1 0-12 0v5l-2 2h16z"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
      <span class="dot"></span>
    </button>
    <div class="menu-list notes-panel" id="notesPanel"></div>
  </div>
  <div class="ingame" id="ingame" role="switch" tabindex="0" aria-checked="false">
    <div class="track"></div>
    <div><span class="lbl" data-i18n="inGame">In game</span><span class="sub" id="ingameSub"></span></div>
  </div>
  <div class="menu" id="menu">
    <button class="icon-btn" id="menuBtn" data-i18n-aria="menu" aria-label="Menu" aria-haspopup="true">⋮</button>
    <div class="menu-list">
      <label><input type="checkbox" id="optSound"> <span data-i18n="optSound">Alert sound</span></label>
      <button id="testSound" data-i18n="testSound">🔔 Play test sound</button>
      <label><input type="checkbox" id="optNotify"> <span data-i18n="optNotify">Desktop notifications</span></label>
      <hr>
      <button id="expBtn" data-i18n="export">📤 Export Production.json</button>
      <button id="impBtn" data-i18n="import">📥 Import Production.json</button>
      <input type="file" id="impFile" accept=".json" hidden>
      <hr>
      <button id="helpBtn" data-i18n="help">❓ Help</button>
      <button id="aboutBtn" data-i18n="about">ℹ️ About & changelog</button>
      <hr>
      <button id="resetBtn" class="danger" data-i18n="resetAll">Reset everything</button>
    </div>
  </div>
</header>

<aside id="sidebar" data-i18n-aria="categories" aria-label="Business categories">
  <div id="tiles"></div>
</aside>
<div id="flyout" role="menu"></div>
<div id="quick" aria-live="polite"></div>

<main id="map" data-i18n-aria="mapLbl" aria-label="Map">
  <div class="map-loading" id="mapLoading" data-i18n="loadingMap">Loading map…</div>
  <div id="world">
    <img id="mapImg" src="map.webp" alt="">
    <div id="pins"></div>
  </div>
  <div class="place-hint" id="placeHint"></div>
  <div class="pin-ghost" id="ghost" aria-hidden="true"></div>
  <div class="map-tools">
    <button class="icon-btn" id="zoomIn" data-i18n-aria="zoomIn" data-i18n-title="zoomIn" aria-label="Zoom in">+</button>
    <button class="icon-btn" id="zoomOut" data-i18n-aria="zoomOut" data-i18n-title="zoomOut" aria-label="Zoom out">−</button>
    <button class="icon-btn" id="fitBtn" data-i18n-aria="fitMap" data-i18n-title="fitMap" aria-label="Show whole map" title="Show whole map">⛶</button>
  </div>
</main>

<section id="win" aria-live="polite"></section>
<div id="toast" role="status"><span id="toastText"></span><button id="toastAct" class="btn ghost" hidden></button></div>
<dialog id="modal" aria-labelledby="modalTitle">
  <div class="modal-head"><h2 id="modalTitle"></h2><button class="icon-btn" id="modalClose" data-i18n-aria="close" aria-label="Close">✕</button></div>
  <div class="modal-body" id="modalBody"></div>
</dialog>
<div id="noteStack" aria-live="polite"></div>

<script>
"use strict";
/* ======================================================================
   Game data
   Production minutes per unit and capacities are the same across sources.
   Fully upgraded supply usage and values are cross-checked; values and
   supply usage without upgrades are estimates and can be overridden
   per business in the window ("Advanced").
   ====================================================================== */
const ICON = {
  club: `<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="23" fill="#c4561f"/><g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="31" r="6"/><circle cx="36" cy="31" r="5"/><path d="M36 31l-5-13h4M19 30h8l4-9-10-1-4 5"/><path d="M8 26c2-3 5-4 9-3"/></g></svg>`,
  weed: `<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="23" fill="#3c8a30"/><path fill="#fff" d="M24 9c2 5 2 10 0 16-2-6-2-11 0-16zm0 16c4-4 9-6 14-6-3 5-8 7-14 6zm0 0c-4-4-9-6-14-6 3 5 8 7 14 6zm0 0c3 1 7 4 9 8-5 0-8-3-9-8zm0 0c-3 1-7 4-9 8 5 0 8-3 9-8zm-1 0h2v14h-2z"/></svg>`,
  cash: `<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="23" fill="#5f7f2c"/><g fill="none" stroke="#fff" stroke-width="2.4"><rect x="10" y="17" width="28" height="15" rx="2"/><circle cx="24" cy="24.5" r="4"/><path d="M13 14h22M14 35h20" stroke-linecap="round"/></g></svg>`,
  coke: `<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="23" fill="#5a6f8c"/><g stroke="#fff" stroke-width="2.4" stroke-linejoin="round"><path d="M11 20l13-6 13 6v10l-13 6-13-6z" fill="none"/><path d="M11 20l13 6 13-6M24 26v10" fill="none"/></g></svg>`,
  docs: `<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="23" fill="#8a7240"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><rect x="10" y="15" width="28" height="19" rx="2"/><circle cx="18" cy="23" r="3"/><path d="M14 30c1-3 7-3 8 0M26 21h8M26 25h8M26 29h5"/></g></svg>`,
  meth: `<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="23" fill="#2a8199"/><g fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"><path d="M24 10l7 9-7 19-7-19z"/><path d="M17 19h14M24 10v28"/></g></svg>`
};

const BIKE_ART_UNUSED = `<svg class="bike" viewBox="0 0 150 80"><g fill="none" stroke="rgba(255,226,190,.55)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="30" cy="56" r="18"/><circle cx="124" cy="58" r="15"/><path d="M124 58 104 22h10M48 54h34l14-24-30-4-12 12"/><path d="M14 46c8-10 20-12 32-8"/></g></svg>`;

// minutes per unit by upgrade level: none / one (equipment OR staff) / both
const MC = [
  { id: "club", icon: "club", cls: "c-club", production: false },
  { id: "weed", icon: "weed", cls: "c-weed", production: true, cap: 80,
    mpu: { none: 6, one: 5, both: 4 }, upb: { equip: 50, noEquip: 40 },
    value: { none: 2025, one: 2325, both: 2625 } },
  { id: "cash", icon: "cash", cls: "c-cash", production: true, cap: 40,
    mpu: { none: 12, one: 10, both: 8 }, upb: { equip: 20, noEquip: 16 },
    value: { none: 4725, one: 5425, both: 6125 } },
  { id: "coke", icon: "coke", cls: "c-coke", production: true, cap: 10,
    mpu: { none: 50, one: 40, both: 30 }, upb: { equip: 4, noEquip: 3.2 },
    value: { none: 27000, one: 31000, both: 35000 } },
  { id: "docs", icon: "docs", cls: "c-docs", production: true, cap: 60,
    mpu: { none: 5, one: 4, both: 3 }, upb: { equip: 50, noEquip: 40 },
    value: { none: 1350, one: 1550, both: 1750 } },
  { id: "meth", icon: "meth", cls: "c-meth", production: true, cap: 20,
    mpu: { none: 30, one: 24, both: 18 }, upb: { equip: 8, noEquip: 6.4 },
    value: { none: 11475, one: 13175, both: 14875 } }
];
const CATEGORIES = [
  { id: "mc", art: "art-mc", ready: true, emblem: true },

const STORE_KEY = "gtaProductionV5";
function defaultBiz(def) {
  return def.production
    ? { owned: false, pin: null, equip: false, staff: false, supplies: 0, stock: 0, alertMin: 15, over: {}, alert: null, nearFull: false }
    : { owned: false, pin: null, alert: null,
        // Bar Resupply: 48 min real-time cooldown; a restock lasts ~4 in-game days (4 x 48 min)
        bar: { last: null, remind: true, cdMin: 48, stockMin: 192, fired: {},
               // Bar Earnings: paid once per in-game day (48 min) while stocked, into a bag in the office
               bag: 0, paidTo: null, payout: 5000, cap: 100000 },
        // Custom Bike Shop: no fixed cooldown in the game, 48 min is a common observation
        shop: { has: false, last: null, remind: true, cdMin: 48, fired: {} } };
}
function defaultState() {
  const biz = {};
  MC.forEach(d => biz[d.id] = defaultBiz(d));
  return { v: 5, inGame: false, lastTick: Date.now(), sideOpen: true, sound: true, notify: false, biz, notes: [] };
}
let S = defaultState();

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) S = mergeState(JSON.parse(raw));
    lang = localStorage.getItem("gtaProductionLang") || "en";
  } catch (e) { console.warn(e); }
}
function mergeState(data) {
  const base = defaultState();
  const out = { ...base, ...data, biz: { ...base.biz } };
  MC.forEach(d => { out.biz[d.id] = { ...defaultBiz(d), ...((data.biz || {})[d.id] || {}) }; });
  const club = out.biz.club, dc = defaultBiz(defOf("club")), src = (data.biz || {}).club || {};
  club.bar = { ...dc.bar, ...(src.bar || {}) };
  club.shop = { ...dc.shop, ...(src.shop || {}) };
  out.notes = Array.isArray(data.notes) ? data.notes.slice(0, 60) : [];
  return out;
}
let saveTimer = null;
function save(now = false) {
  clearTimeout(saveTimer);
  const write = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} };
  if (now) write(); else saveTimer = setTimeout(write, 400);
}

/* ======================================================================
   Production math
   ====================================================================== */
const defOf = id => MC.find(d => d.id === id);
function level(b) { return b.equip && b.staff ? "both" : (b.equip || b.staff) ? "one" : "none"; }
function numbers(id) {
  const d = defOf(id), b = S.biz[id], lv = level(b);
  return {
    cap: d.cap,
    mpu: +b.over.mpu || d.mpu[lv],
    upb: +b.over.upb || (b.equip ? d.upb.equip : d.upb.noEquip),
    value: +b.over.value || d.value[lv],
    estimated: lv !== "both"
  };
}
// advance one business by dt minutes of play time
function advance(id, dt) {
  const b = S.biz[id];
  if (!b.owned || dt <= 0) return;
  const n = numbers(id);
  if (b.supplies <= 0 || b.stock >= n.cap) return;
  const units = Math.min(dt / n.mpu, b.supplies * n.upb, n.cap - b.stock);
  b.stock = Math.min(n.cap, b.stock + units);
  b.supplies = Math.max(0, b.supplies - units / n.upb);
  if (b.supplies < 1e-6) b.supplies = 0;
}
// minutes until supplies run out / stock is full (Infinity = never)
function forecast(id) {
  const b = S.biz[id], n = numbers(id);
  const unitsFromSupplies = b.supplies * n.upb;
  const unitsToFull = n.cap - b.stock;
  const minToEmpty = b.stock >= n.cap ? Infinity : unitsFromSupplies * n.mpu;
  const minToFull = unitsFromSupplies >= unitsToFull - 1e-9 ? unitsToFull * n.mpu : Infinity;
  return { minToEmpty: Math.min(minToEmpty, unitsToFull * n.mpu), suppliesOutFirst: unitsFromSupplies < unitsToFull, minToFull, n };
}
function status(id) {
  const d = defOf(id), b = S.biz[id];
  if (!b.owned) return "idle";
  if (!d.production) return "ok";
  const n = numbers(id);
  if (b.stock >= n.cap - 1e-6) return "full";
  if (b.supplies <= 0) return "empty";
  const f = forecast(id);
  if (f.suppliesOutFirst && f.minToEmpty <= b.alertMin) return "low";
  return "ok";
}
function fmtTime(min) {
  if (!isFinite(min)) return "—";
  const m = Math.max(0, Math.round(min));
  const h = Math.floor(m / 60), r = m % 60;
  return h ? `${h}h ${String(r).padStart(2, "0")}m` : `${r}m`;
}
const money = n => "$" + Math.round(n).toLocaleString("en-US");

/* ======================================================================
   Alerts: soft chime, map flash, optional desktop notification
   ====================================================================== */
let audioCtx = null;
function chime() {
  if (!S.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") { audioCtx.resume(); }
    const now = audioCtx.currentTime;
    // two soft bell-like notes (E6, then B5), quiet and short
    [[1318.5, 0], [987.8, 0.22]].forEach(([f, at]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine";
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, now + at);
      g.gain.exponentialRampToValueAtTime(0.07, now + at + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + at + 0.9);
      o.connect(g).connect(audioCtx.destination);
      o.start(now + at);
      o.stop(now + at + 1);
    });
  } catch (e) { console.warn(e); }
}
// browsers only allow sound after the first interaction
window.addEventListener("pointerdown", () => {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) {}
}, { once: true });

// Every alert: a card top-right (fades in, then out), the bell's history, a soft chime,
// and a desktop notification when the tab is in the background (if enabled).
function notify(msg, kind = "info", biz = null) {
  const note = { id: Date.now() + Math.random(), at: Date.now(), msg, kind, biz, read: false };
  S.notes.unshift(note);
  S.notes.length = Math.min(S.notes.length, 60);
  showNote(note);
  renderBell();
  chime();
  if (S.notify && "Notification" in window && Notification.permission === "granted" && document.hidden) {
    try { new Notification("Production Manager", { body: msg, silent: true }); } catch (e) {}
  }
  save();
}
// An alert fires only when production itself changes the state (timers running),
// not when you edit numbers by hand. It keeps flashing until you open the business.
const lastSt = {};
function nearFull(id) {
  const b = S.biz[id], n = numbers(id), f = forecast(id);
  return b.owned && b.stock < n.cap - 1e-6 && isFinite(f.minToFull) && f.minToFull <= b.alertMin;
}
function syncStatus() {
  MC.filter(d => d.production).forEach(d => {
    const st = status(d.id), b = S.biz[d.id];
    lastSt[d.id] = st;
    b.nearFull = nearFull(d.id);
    if (b.alert && b.alert !== st && !(b.alert === "nearfull" && b.nearFull)) b.alert = null;   // fixed by hand: stop flashing
  });
}
const KIND_OF = { low: "warn", empty: "bad", full: "full", nearfull: "full" };
function checkAlerts(fromProduction) {
  MC.filter(d => d.production).forEach(d => {
    const b = S.biz[d.id];
    const st = status(d.id), prev = lastSt[d.id];
    lastSt[d.id] = st;
    const nf = nearFull(d.id), prevNf = b.nearFull;
    b.nearFull = nf;
    if (b.alert && b.alert !== st && !(b.alert === "nearfull" && nf)) b.alert = null;
    if (!fromProduction || !b.owned) return;
    if (prev !== undefined && prev !== st && (st === "low" || st === "empty" || st === "full")) {
      b.alert = st;
      notify(t("alert" + st[0].toUpperCase() + st.slice(1), bizName(d.id)), KIND_OF[st], d.id);
    } else if (nf && !prevNf && st !== "full") {
      b.alert = b.alert || "nearfull";
      notify(t("alertNearFull", { n: bizName(d.id), m: fmtTime(forecast(d.id).minToFull) }), "full", d.id);
    }
  });
  checkClub();
}

/* Clubhouse timers run in real time (the game counts them while you play;
   cooldowns are short enough that real time is the practical choice) */
function minsLeft(last, min) {
  if (!last) return null;
  return Math.max(0, (last + min * 60000 - Date.now()) / 60000);
}
const GAME_DAY_MIN = 48;
// Payouts happen on the delivery and then every in-game day until the bar runs dry:
// 5 payouts per restock (4 days of stock), which matches the $25,000 per restock reported.
function barPayTimes(bar) {
  if (!bar.last) return [];
  const n = Math.floor(bar.stockMin / GAME_DAY_MIN);
  return Array.from({ length: n + 1 }, (_, k) => bar.last + k * GAME_DAY_MIN * 60000);
}
function settleBar(now = Date.now()) {
  const bar = S.biz.club.bar;
  if (!bar.last) { bar.paidTo = now; return; }
  const from = bar.paidTo ?? bar.last - 1;
  const due = barPayTimes(bar).filter(tm => tm > from && tm <= now).length;
  if (due) bar.bag = Math.min(bar.cap, (bar.bag || 0) + due * bar.payout);
  bar.paidTo = now;
}
function barInfo() {
  const bar = S.biz.club.bar, now = Date.now();
  const next = barPayTimes(bar).find(tm => tm > now);
  return {
    cd: minsLeft(bar.last, bar.cdMin),
    stock: minsLeft(bar.last, bar.stockMin),
    bag: bar.bag || 0,
    full: (bar.bag || 0) >= bar.cap,
    nextPay: next && (bar.bag || 0) < bar.cap ? (next - now) / 60000 : null

}
function shopInfo() {
  const sh = S.biz.club.shop;
  return { cd: sh.has ? minsLeft(sh.last, sh.cdMin) : null };
}
function checkClub() {
  const c = S.biz.club;
  if (!c.owned) return;
  const bagBefore = c.bar.bag || 0;
  settleBar();
  const bi = barInfo(), si = shopInfo(), bf = c.bar.fired, sf = c.shop.fired;
  if (bi.full && bagBefore < c.bar.cap) notify(t("bagFull", money(c.bar.cap)), "full", "club");
  if (c.bar.last) {
    if (c.bar.remind && bi.cd === 0 && !bf.ready) { bf.ready = true; c.alert = "ready"; notify(t("barReady"), "ok", "club"); }
    if (bi.stock > 0 && bi.stock <= 15 && !bf.low) { bf.low = true; notify(t("barLow", fmtTime(bi.stock)), "warn", "club"); }
    if (bi.stock === 0 && !bf.empty) { bf.empty = true; c.alert = "ready"; notify(t("barEmpty"), "bad", "club"); }
  }
  if (c.shop.has && c.shop.last && c.shop.remind && si.cd === 0 && !sf.ready) {
    sf.ready = true; c.alert = "ready"; notify(t("shopReady"), "ok", "club");
  }
}
function alertKind(id) { return S.biz[id].alert || null; }
function ackAlerts(id) { S.biz[id].alert = null; }

/* ======================================================================
   Clock: only advances while "In game" is on
   ====================================================================== */
function tick() {
  const now = Date.now();
  if (S.inGame) {
    const dt = (now - S.lastTick) / 60000;
    MC.filter(d => d.production).forEach(d => advance(d.id, dt));
  }
  S.lastTick = now;
  checkAlerts(S.inGame);
  renderLive();
  save();
}

/* ======================================================================
   Map camera
   - never smaller than "whole map visible", always centered at that zoom
   - wheel / pinch zoom anchored at the cursor or between the fingers
   - left-button drag to pan, with a little momentum on release
   - double-click / double-tap to zoom in, keyboard + - 0 and arrows
   - every move eases smoothly; edges never drift into the middle
   ====================================================================== */
const mapEl = document.getElementById("map");
const world = document.getElementById("world");
const img = document.getElementById("mapImg");
const pinsEl = document.getElementById("pins");
let imgW = 0, imgH = 0;
const cam = { s: 1, x: 0, y: 0 };       // what is drawn
const goal = { s: 1, x: 0, y: 0 };      // where we're heading
let minS = 0.1;
const MAX_ZOOM_NATIVE = 1.6;            // up to 160% of the image's real pixels
let vel = { x: 0, y: 0 };               // momentum after a drag (px per ms)
let rafId = null, lastFrame = 0;

const viewSize = () => ({ w: mapEl.clientWidth, h: mapEl.clientHeight });

// legal x/y for a given scale: centered on an axis the map doesn't fill, edges locked otherwise
function clampPos(s, x, y) {
  const { w, h } = viewSize();
  const mw = imgW * s, mh = imgH * s;
  x = mw <= w ? (w - mw) / 2 : Math.min(0, Math.max(w - mw, x));
  y = mh <= h ? (h - mh) / 2 : Math.min(0, Math.max(h - mh, y));
  return { x, y };
}
function computeMinS() {
  const { w, h } = viewSize();
  minS = Math.min(w / imgW, h / imgH);
}
function setGoal(s, x, y, instant) {
  s = Math.min(MAX_ZOOM_NATIVE, Math.max(minS, s));
  const p = clampPos(s, x, y);
  goal.s = s; goal.x = p.x; goal.y = p.y;
  if (instant) { cam.s = s; cam.x = p.x; cam.y = p.y; draw(); }
  else kick();
}
// zoom so the world point under (cx, cy) stays under it
function zoomAt(factor, cx, cy, instant) {
  const ns = Math.min(MAX_ZOOM_NATIVE, Math.max(minS, goal.s * factor));
  const wx = (cx - goal.x) / goal.s, wy = (cy - goal.y) / goal.s;
  setGoal(ns, cx - wx * ns, cy - wy * ns, instant);
}
function fitMap(instant) {
  if (!imgW) return;
  computeMinS();
  setGoal(minS, 0, 0, instant);
}
// bring a map point (0..1) to the middle of the free area, zooming in if we're far out
function flyTo(p, minZoomFactor = 2.2) {
  if (!imgW || !p) return;
  const { w, h } = viewSize();
  const s = Math.max(goal.s, Math.min(MAX_ZOOM_NATIVE, minS * minZoomFactor));
  const winOpen = win.classList.contains("open") && !isPhone();
  const freeW = winOpen ? w - win.offsetWidth - 24 : w;
  const freeH = isPhone() && win.classList.contains("open") ? h * 0.35 : h;
  setGoal(s, freeW / 2 - p.x * imgW * s, freeH / 2 - p.y * imgH * s);
}

function draw() {
  world.style.transform = `translate3d(${cam.x}px, ${cam.y}px, 0) scale(${cam.s})`;
  pinsEl.style.setProperty("--inv", 1 / cam.s);
  mapEl.classList.toggle("far", cam.s < minS * 1.5);
}
function kick() {
  if (!rafId) { lastFrame = performance.now(); rafId = requestAnimationFrame(frame); }
}
function frame(now) {
  const dt = Math.min(50, now - lastFrame);
  lastFrame = now;
  // momentum: glide and slow down
  if (!drag && (Math.abs(vel.x) > 0.01 || Math.abs(vel.y) > 0.01)) {
    const p = clampPos(goal.s, goal.x + vel.x * dt, goal.y + vel.y * dt);
    goal.x = p.x; goal.y = p.y;
    const decay = Math.pow(0.0025, dt / 1000);
    vel.x *= decay; vel.y *= decay;
  } else if (!drag) { vel.x = vel.y = 0; }
  // ease toward the goal, same speed at any frame rate
  const k = 1 - Math.pow(0.000004, dt / 1000);
  cam.s += (goal.s - cam.s) * k;
  cam.x += (goal.x - cam.x) * k;
  cam.y += (goal.y - cam.y) * k;
  const done = Math.abs(goal.s - cam.s) < goal.s * 1e-4 && Math.abs(goal.x - cam.x) < 0.3 && Math.abs(goal.y - cam.y) < 0.3 && !vel.x && !vel.y;
  if (done) { cam.s = goal.s; cam.x = goal.x; cam.y = goal.y; }
  draw();
  rafId = done && !drag ? null : requestAnimationFrame(frame);
}

function mapReady() {
  imgW = img.naturalWidth;
  imgH = img.naturalHeight;
  world.style.width = imgW + "px";
  world.style.height = imgH + "px";
  const ld = document.getElementById("mapLoading");
  if (ld) ld.remove();
  fitMap(true);
  renderPins();
}
// the image may already be loaded (from cache) before this script runs
if (img.complete && img.naturalWidth) setTimeout(mapReady, 0);
else {
  img.addEventListener("load", mapReady, { once: true });
  img.addEventListener("error", () => { document.getElementById("mapLoading").textContent = t("mapMissing"); }, { once: true });
}

// keep the same spot in the middle when the map area changes size (window, sidebar)
let lastSize = null;
new ResizeObserver(() => {
  if (!imgW) return;
  const { w, h } = viewSize();
  const wasFit = goal.s <= minS * 1.001;
  const prev = lastSize || { w, h };
  const cx = (prev.w / 2 - goal.x) / goal.s, cy = (prev.h / 2 - goal.y) / goal.s;
  lastSize = { w, h };
  computeMinS();
  if (wasFit) fitMap(true);
  else setGoal(goal.s, w / 2 - cx * goal.s, h / 2 - cy * goal.s, true);
}).observe(mapEl);

/* --- wheel: mouse wheels step, trackpads glide, ctrl+wheel = trackpad pinch --- */
mapEl.addEventListener("wheel", e => {
  e.preventDefault();
  if (!imgW) return;
  const r = mapEl.getBoundingClientRect();
  let dy = e.deltaY;
  if (e.deltaMode === 1) dy *= 16;
  else if (e.deltaMode === 2) dy *= r.height;
  const strength = e.ctrlKey ? 0.012 : 0.0022;
  const factor = Math.min(1.8, Math.max(1 / 1.8, Math.exp(-dy * strength)));
  zoomAt(factor, e.clientX - r.left, e.clientY - r.top);
}, { passive: false });

/* --- pointers: drag to pan, pinch to zoom, drag pins, click to place --- */
const pointers = new Map();
let drag = null, pinch = null, pinDrag = null, lastTap = 0;
const local = e => { const r = mapEl.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };

mapEl.addEventListener("pointerdown", e => {
  if (e.target.closest(".map-tools") || !imgW) return;
  if (e.pointerType === "mouse" && e.button !== 0) return;     // left button only
  mapEl.setPointerCapture(e.pointerId);
  const p = local(e);
  pointers.set(e.pointerId, p);
  vel = { x: 0, y: 0 };

  if (pointers.size === 2) {
    // second finger: switch to pinch
    drag = null; pinDrag = null;
    const [a, b] = [...pointers.values()];
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: goal.s, wx: (mid.x - goal.x) / goal.s, wy: (mid.y - goal.y) / goal.s };
    return;
  }
  const pinEl = e.target.closest(".pin");
  if (pinEl && !placing) {
    pinDrag = { id: pinEl.dataset.id, start: p, moved: false };
    return;
  }
  drag = { start: p, last: p, lastT: performance.now(), gx: goal.x, gy: goal.y, moved: false, t0: performance.now() };
  // follow the finger/mouse 1:1 while dragging
  cam.s = goal.s;
  kick();
});

mapEl.addEventListener("pointermove", e => {
  const p = local(e);
  if (placing) moveGhost(p);
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, p);

  if (pinch && pointers.size >= 2) {
    const [a, b] = [...pointers.values()];
    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    const ns = Math.min(MAX_ZOOM_NATIVE, Math.max(minS, pinch.s * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d));
    setGoal(ns, mid.x - pinch.wx * ns, mid.y - pinch.wy * ns, true);
    return;
  }
  if (pinDrag) {
    if (!pinDrag.moved && Math.hypot(p.x - pinDrag.start.x, p.y - pinDrag.start.y) > 6) pinDrag.moved = true;
    if (pinDrag.moved) {
      S.biz[pinDrag.id].pin = toMap(p.x, p.y);
      positionPin(pinDrag.id);
    }
    return;
  }
  if (drag) {
    const dx = p.x - drag.start.x, dy = p.y - drag.start.y;
    if (!drag.moved && Math.hypot(dx, dy) > 6) { drag.moved = true; mapEl.classList.add("dragging"); }
    if (!drag.moved) return;
    const now = performance.now(), dtm = Math.max(1, now - drag.lastT);
    // smoothed velocity for the glide after release
    vel.x = vel.x * 0.6 + ((p.x - drag.last.x) / dtm) * 0.4;
    vel.y = vel.y * 0.6 + ((p.y - drag.last.y) / dtm) * 0.4;
    drag.last = p; drag.lastT = now;
    const c = clampPos(goal.s, drag.gx + dx, drag.gy + dy);
    goal.x = cam.x = c.x;
    goal.y = cam.y = c.y;
    draw();
  }
});

function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  const p = local(e);
  pointers.delete(e.pointerId);

  if (pinch) {
    if (pointers.size < 2) pinch = null;
    if (pointers.size === 1) {
      // one finger stays down: continue as a pan from here
      const rest = [...pointers.values()][0];
      drag = { start: rest, last: rest, lastT: performance.now(), gx: goal.x, gy: goal.y, moved: true, t0: 0 };
    }
    return;
  }
  if (pinDrag) {
    if (pinDrag.moved) { save(true); toast(t("pinMoved", bizName(pinDrag.id))); }
    else openWin(pinDrag.id);
    pinDrag = null;
    return;
  }
  if (drag) {
    const wasClick = !drag.moved && e.type === "pointerup";
    const releasedLate = performance.now() - drag.lastT > 80;   // stopped before letting go: no glide
    drag = null;
    mapEl.classList.remove("dragging");
    if (releasedLate || !wasClick && Math.hypot(vel.x, vel.y) < 0.05) vel = { x: 0, y: 0 };
    if (wasClick) {
      vel = { x: 0, y: 0 };
      if (placing) { placeAt(p); return; }
      // double click / double tap zooms in on that spot
      const now = performance.now();
      if (now - lastTap < 320) { zoomAt(2, p.x, p.y); lastTap = 0; }
      else lastTap = now;
    }
    kick();
  }
}
mapEl.addEventListener("pointerup", endPointer);
mapEl.addEventListener("pointercancel", endPointer);
mapEl.addEventListener("pointerleave", () => { if (placing) hideGhost(); });
mapEl.addEventListener("contextmenu", e => { if (placing) { e.preventDefault(); cancelPlacing(); } });

/* --- keyboard (when the map has focus) --- */
mapEl.tabIndex = 0;
mapEl.addEventListener("keydown", e => {
  const { w, h } = viewSize();
  const step = 120;
  const keys = {
    "+": () => zoomAt(1.5, w / 2, h / 2), "=": () => zoomAt(1.5, w / 2, h / 2),
    "-": () => zoomAt(1 / 1.5, w / 2, h / 2), "_": () => zoomAt(1 / 1.5, w / 2, h / 2),
    "0": () => fitMap(),
    ArrowLeft: () => setGoal(goal.s, goal.x + step, goal.y), ArrowRight: () => setGoal(goal.s, goal.x - step, goal.y),
    ArrowUp: () => setGoal(goal.s, goal.x, goal.y + step), ArrowDown: () => setGoal(goal.s, goal.x, goal.y - step)
  };
  if (keys[e.key]) { e.preventDefault(); keys[e.key](); }
});

// point inside #map (px) -> position on the map image (0..1)
function toMap(px, py) {
  return {
    x: Math.min(1, Math.max(0, (px - cam.x) / cam.s / imgW)),
    y: Math.min(1, Math.max(0, (py - cam.y) / cam.s / imgH))
  };
}
function isPhone() { return matchMedia("(max-width: 760px)").matches; }

document.getElementById("zoomIn").onclick = () => { const { w, h } = viewSize(); zoomAt(1.6, w / 2, h / 2); };
document.getElementById("zoomOut").onclick = () => { const { w, h } = viewSize(); zoomAt(1 / 1.6, w / 2, h / 2); };
document.getElementById("fitBtn").onclick = () => fitMap();

/* --- placing a pin: a ghost pin follows the cursor, click to drop it --- */
let placing = null;
const ghost = document.getElementById("ghost");
function startPlacing(id) {
  placing = id;
  mapEl.classList.add("placing");
  ghost.innerHTML = `<div class="pin-disc"><div class="ico">${ICON[defOf(id).icon]}</div></div>`;
  document.getElementById("placeHint").textContent = t("placeHint", bizName(id));
  closeWin();
  closeFlyout();
  if (isPhone()) setSide(false);
  mapEl.focus({ preventScroll: true });
}
function moveGhost(p) {
  ghost.style.transform = `translate(${p.x}px, ${p.y}px)`;
  ghost.classList.add("show");
}
function hideGhost() { ghost.classList.remove("show"); }
function placeAt(p) {
  const id = placing;
  S.biz[id].pin = toMap(p.x, p.y);
  stopPlacing();
  save(true);
  renderPins();
  renderAll();
  openWin(id, false);
  toast(t("pinPlaced", bizName(id)));
}
function stopPlacing() {
  placing = null;
  mapEl.classList.remove("placing");
  hideGhost();
}
function cancelPlacing() {
  const id = placing;
  stopPlacing();
  if (id) openWin(id, false);
}

/* ======================================================================
   Rendering
   ====================================================================== */
function seg5Html(b, id) {
  const filled = Math.ceil(b.supplies * 5 - 1e-6);
  const st = status(id);
  const cls = st === "low" ? " low" : st === "empty" ? " empty" : "";
  return `<span class="seg5${cls}">${[0,1,2,3,4].map(i => `<i class="${i < filled ? "on" : ""}"></i>`).join("")}</span>`;
}
function ringHtml(id) {
  const d = defOf(id), b = S.biz[id];
  if (!d.production) return "";
  const n = numbers(id);
  const frac = Math.min(1, b.stock / n.cap);
  const C = 2 * Math.PI * 21;
  const st = status(id);
  const col = st === "full" ? "var(--full)" : frac > 0.66 ? "var(--ok)" : frac > 0.33 ? "var(--warn)" : "var(--bad)";
  return `<svg class="ring" viewBox="0 0 46 46"><circle cx="23" cy="23" r="21" fill="rgba(10,14,20,.85)" stroke="rgba(255,255,255,.15)" stroke-width="4"/><circle cx="23" cy="23" r="21" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C * frac} ${C}"/></svg>`;
}

function renderPins() {
  const host = document.getElementById("pins");
  host.innerHTML = "";
  MC.forEach(d => {
    const b = S.biz[d.id];
    if (!b.owned || !b.pin) return;
    const el = document.createElement("div");
    el.className = "pin";
    el.dataset.id = d.id;
    el.innerHTML = `<div class="pin-body"><div class="pin-disc">${ringHtml(d.id)}<div class="ico">${ICON[d.icon]}</div></div>${d.production ? seg5Html(b, d.id) : ""}<div class="pin-label">${bizName(d.id)}</div></div>`;
    host.appendChild(el);
    positionPin(d.id);
  });
  updatePinStates();
}
function positionPin(id) {
  const el = pinsEl.querySelector(`.pin[data-id="${id}"]`);
  const p = S.biz[id].pin;
  if (!el || !p || !imgW) return;
  el.style.left = p.x * imgW + "px";
  el.style.top = p.y * imgH + "px";
}
function updatePinStates() {
  document.querySelectorAll(".pin").forEach(el => {
    const id = el.dataset.id, d = defOf(id);
    const a = alertKind(id);
    el.classList.toggle("alert", !!a);
    el.classList.remove("a-low", "a-empty", "a-full", "a-nearfull", "a-ready");
    if (a) el.classList.add("a-" + a);
    el.classList.toggle("selected", openId === id);
    if (d.production) {
      el.querySelector(".pin-disc svg.ring").outerHTML = ringHtml(id);
      el.querySelector(".seg5").outerHTML = seg5Html(S.biz[id], id);
    }
  });
}

function renderTiles() {
  const host = document.getElementById("tiles");
  host.innerHTML = "";
  CATEGORIES.forEach(c => {
    const el = document.createElement("div");
    el.className = "tile" + (c.ready ? "" : " locked") + (c.emblem ? " emblem" : "");
    el.dataset.cat = c.id;
    el.tabIndex = c.ready ? 0 : -1;
    const owned = c.id === "mc" ? MC.filter(d => S.biz[d.id].owned).length : 0;
    el.innerHTML = `<div class="art ${c.art}">${c.id === "mc" ? '<div class="beam"></div>' : ""}</div>
      ${c.ready ? `<div class="tile-dots">${MC.filter(d => d.production).map(d => `<i class="${S.biz[d.id].owned ? status(d.id) : ""}"></i>`).join("")}</div>` : `<span class="soon">${t("soon")}</span>`}
      <div class="tile-text"><h2>${t("cat_" + c.id)}</h2>${c.id === "mc" ? `<div class="tile-sub">${t("mcSub", owned)}</div>` : ""}</div>`;
    if (c.ready) bindTile(el, c);
    host.appendChild(el);
  });
}

/* fly-out with a grace period so the gap between tile and tabs doesn't close it */
const flyout = document.getElementById("flyout");
let flyTimer = null, flyCat = null;
const canHover = matchMedia("(hover: hover)").matches;
function bindTile(el, c) {
  if (canHover) {
    el.addEventListener("mouseenter", () => openFlyout(el, c));
    el.addEventListener("mouseleave", scheduleClose);
  }
  el.addEventListener("click", () => {
    if (flyCat === c.id && !canHover) closeFlyout();
    else openFlyout(el, c);
  });
  el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openFlyout(el, c); flyout.querySelector(".tab")?.focus(); } });
}
flyout.addEventListener("mouseenter", () => clearTimeout(flyTimer));
flyout.addEventListener("mouseleave", scheduleClose);
function scheduleClose() {
  clearTimeout(flyTimer);
  flyTimer = setTimeout(() => { if (!segDrag) closeFlyout(); }, 350);
}
function openFlyout(tileEl, c) {
  clearTimeout(flyTimer);
  flyCat = c.id;
  document.querySelectorAll(".tile").forEach(x => x.classList.toggle("open", x === tileEl));
  fillFlyout();
  const r = tileEl.getBoundingClientRect();
  const phone = matchMedia("(max-width: 760px)").matches;
  const left = phone ? Math.min(r.right - 70, innerWidth - 220) : r.right;
  flyout.style.left = left + "px";
  flyout.style.top = Math.max(document.querySelector("header").offsetHeight + 6, Math.min(r.top, innerHeight - flyout.offsetHeight - 10)) + "px";
  requestAnimationFrame(() => flyout.classList.add("show"));
}
function closeFlyout() {
  flyCat = null;
  closeQuick();
  flyout.classList.remove("show");
  document.querySelectorAll(".tile.open").forEach(x => x.classList.remove("open"));
}
function tabSub(id) {
  const d = defOf(id), b = S.biz[id];
  if (!b.owned) return t("notOwned");
  if (!d.production) {
    const bi = barInfo(), si = shopInfo(), parts = [];
    if (b.bar.last) parts.push(bi.cd === 0 ? t("sub_barReady") : t("sub_barIn", fmtTime(bi.cd)));
    if (b.shop.has && b.shop.last && si.cd === 0) parts.push(t("sub_shopReady"));
    if (bi.bag > 0) parts.push(money(bi.bag));
    return parts.join(" · ") || (!b.pin ? t("noPin") : "");
  }
  if (!b.pin) return t("noPin");
  return t("st_" + status(id));
}
function fillFlyout() {
  if (flyCat !== "mc") return;
  flyout.innerHTML = MC.map(d => `<button class="tab ${d.cls}" role="menuitem" data-id="${d.id}">
      <span class="ico">${ICON[d.icon]}</span>
      <span><span class="tab-name">${bizName(d.id)}</span><span class="tab-state"></span></span>
      <span class="tab-bar"></span>
    </button>`).join("");
  flyout.querySelectorAll(".tab").forEach(tb => {
    const id = tb.dataset.id;
    tb.onclick = () => { closeFlyout(); openWin(id); };
    if (canHover) {
      tb.addEventListener("mouseenter", () => { clearTimeout(flyTimer); hoverQuick(id, tb); });
      tb.addEventListener("mouseleave", () => scheduleQuickClose());
    }
  });
  updateFlyout();
}
// refresh texts and bars without rebuilding (keeps hover and the quick panel stable)
function updateFlyout() {
  flyout.querySelectorAll(".tab").forEach(tb => {
    const id = tb.dataset.id, d = defOf(id), b = S.biz[id];
    const sub = tabSub(id);
    const st = tb.querySelector(".tab-state");
    st.textContent = sub;
    st.style.display = sub ? "" : "none";
    tb.querySelector(".tab-bar").innerHTML = d.production && b.owned ? seg5Html(b, id) : "";
  });
}

/* quick panel */
const quick = document.getElementById("quick");
let quickId = null, quickTimer = null, quickOpenTimer = null;
quick.addEventListener("mouseenter", () => { clearTimeout(quickTimer); clearTimeout(flyTimer); });
quick.addEventListener("mouseleave", () => { if (!segDrag) scheduleClose(); });
function hoverQuick(id, tabEl) {
  clearTimeout(quickTimer);
  clearTimeout(quickOpenTimer);
  // instant when switching between tabs, a short beat when arriving
  if (quickId) openQuick(id, tabEl);
  else quickOpenTimer = setTimeout(() => openQuick(id, tabEl), 90);
}
function scheduleQuickClose() {
  clearTimeout(quickOpenTimer);
  clearTimeout(quickTimer);
  quickTimer = setTimeout(() => { if (!segDrag) closeQuick(); }, 300);
}
function openQuick(id, tabEl) {
  quickId = id;
  flyout.querySelectorAll(".tab").forEach(x => x.classList.toggle("hot", x === tabEl));
  renderQuick();
  const r = tabEl.getBoundingClientRect();
  quick.style.left = r.right + 10 + "px";
  const h = quick.offsetHeight;
  quick.style.top = Math.max(document.querySelector("header").offsetHeight + 6, Math.min(r.top - 4, innerHeight - h - 10)) + "px";
  quick.classList.add("show");
}
function closeQuick() {
  clearTimeout(quickTimer);
  clearTimeout(quickOpenTimer);
  quickId = null;
  quick.classList.remove("show");
  flyout.querySelectorAll(".tab.hot").forEach(x => x.classList.remove("hot"));
}
/* Clubhouse: bar + bike shop blocks, same markup in the quick panel and the window */
function clubHtml(px) {
  const c = S.biz.club;

function bindClub(root, rerender) {
  const c = S.biz.club;
  root.querySelectorAll("[data-tg]").forEach(btn => btn.onclick = () => {
    const o = c[btn.dataset.tg];
    o.remind = !o.remind;
    save(true); rerender();
  });
  const act = (sel, fn) => { const el = root.querySelector(`[data-act="${sel}"]`); if (el) fn(el); };
  const undoBar = () => {
    const snap = c.bar.prevSnap;
    c.bar.last = c.bar.prev ?? null;
    c.bar.prev = undefined;
    if (snap) { c.bar.bag = snap.bag; c.bar.paidTo = snap.paidTo; c.bar.prevSnap = undefined; }
    c.bar.fired = { ready: barInfo().cd === 0, low: false, empty: barInfo().stock === 0 };
    save(true); rerender(); renderAll(); liveWin(); liveQuick();
    toast(t("undone"));
  };
  act("barDone", el => el.onclick = () => {
    settleBar();
    c.bar.prevSnap = { bag: c.bar.bag, paidTo: c.bar.paidTo };
    c.bar.prev = c.bar.last;          // remembered so a mistaken click can be undone
    c.bar.last = Date.now();
    c.bar.paidTo = c.bar.last - 1;    // the delivery itself pays out
    c.bar.fired = {};
    c.bar.remind = true;
    if (c.alert) c.alert = null;
    save(true); rerender(); renderAll();
    toast(t("barCd", fmtTime(c.bar.cdMin)), { label: t("undo"), run: undoBar });
  });
  act("barUndo", el => el.onclick = undoBar);
  act("bagCollect", el => el.onclick = () => {
    settleBar();
    const had = c.bar.bag || 0;
    c.bar.bag = 0;
    save(true); rerender(); renderAll();
    toast(t("bagCollected", money(had)), { label: t("undo"), run: () => { c.bar.bag = had; save(true); rerender(); renderAll(); liveWin(); liveQuick(); } });
  });
  act("barClear", el => el.onclick = () => {
    settleBar();
    c.bar.prevSnap = { bag: c.bar.bag, paidTo: c.bar.paidTo };
    c.bar.prev = c.bar.last;
    c.bar.last = null; c.bar.fired = {};
    if (c.alert) c.alert = null;
    save(true); rerender(); renderAll();
    toast(t("barCleared"), { label: t("undo"), run: undoBar });
  });
  act("hasShop", el => el.onchange = () => { c.shop.has = el.checked; if (!c.shop.has) c.shop.last = null; save(true); rerender(); renderAll(); });
  act("bikeDone", el => el.onchange = () => {
    c.shop.last = el.checked ? Date.now() : null;
    c.shop.fired = {};
    if (el.checked) c.shop.remind = true;
    if (c.alert) c.alert = null;
    save(true); rerender(); renderAll();
  });
}

/* ======================================================================
   Segment bars (supplies & stock), shared by the quick panel and the window
   Stock snaps to whole units, like the game; supplies snap to quarter boxes.
   ====================================================================== */
function barValue(kind, id) {
  const b = S.biz[id];
  return kind === "stock" ? Math.min(1, b.stock / numbers(id).cap) : b.supplies;
}
function barTicks(kind, id) {
  if (kind === "supplies") return 4;
  const per = numbers(id).cap / 5;           // units in one box: coke 2, meth 4, cash 8, docs 12, weed 16
  return per <= 8 ? per : 4;                 // too many lines get noisy: show quarters
}
function segBarHtml(kind, id, extra = "") {
  const label = t(kind === "stock" ? "stock" : "supplies");
  return `<div class="segbar ${kind} ${extra}" data-kind="${kind}" data-id="${id}" role="slider" tabindex="0" aria-label="${label}">
    ${[0, 1, 2, 3, 4].map(() => `<div class="seg" style="--ticks:${barTicks(kind, id)}"><i></i></div>`).join("")}
  </div>`;
}
function updateSegBar(el) {
  const kind = el.dataset.kind, id = el.dataset.id, v = barValue(kind, id);
  el.querySelectorAll(".seg i").forEach((i, k) => { i.style.width = Math.max(0, Math.min(1, v * 5 - k)) * 100 + "%"; });
  if (kind === "supplies") {
    const st = status(id);
    el.classList.toggle("low", st === "low");
    el.classList.toggle("empty", S.biz[id].supplies <= 0);
  }
  const b = S.biz[id];
  el.setAttribute("aria-valuemin", 0);
  el.setAttribute("aria-valuemax", kind === "stock" ? numbers(id).cap : 100);
  el.setAttribute("aria-valuenow", kind === "stock" ? Math.floor(b.stock + 1e-6) : Math.round(b.supplies * 100));
}
function setBar(kind, id, v) {
  const b = S.biz[id];
  v = Math.max(0, Math.min(1, v));
  if (kind === "stock") b.stock = Math.round(v * numbers(id).cap);
  else b.supplies = Math.round(v * 20) / 20;
  afterEdit(false);
}
// pointer x -> 0..1 across the 5 boxes (the gaps belong to the box on their left)
function barFromX(el, x) {
  const segs = [...el.querySelectorAll(".seg")];
  for (let k = 0; k < segs.length; k++) {
    const r = segs[k].getBoundingClientRect();
    const next = segs[k + 1] ? segs[k + 1].getBoundingClientRect().left : r.right;
    if (x < next || k === segs.length - 1) {
      const f = Math.max(0, Math.min(1, (x - r.left) / r.width));
      return (k + f) / 5;
    }
  }
  return 0;
}
let segDrag = null;
document.addEventListener("pointerdown", e => {
  const el = e.target.closest(".segbar");
  if (!el || (e.pointerType === "mouse" && e.button !== 0)) return;
  e.preventDefault();
  el.setPointerCapture(e.pointerId);
  el.classList.add("dragging");
  segDrag = { el, pid: e.pointerId };
  setBar(el.dataset.kind, el.dataset.id, barFromX(el, e.clientX));
});
document.addEventListener("pointermove", e => {
  if (!segDrag || e.pointerId !== segDrag.pid) return;
  setBar(segDrag.el.dataset.kind, segDrag.el.dataset.id, barFromX(segDrag.el, e.clientX));
});
function endSegDrag(e) {
  if (!segDrag || e.pointerId !== segDrag.pid) return;
  segDrag.el.classList.remove("dragging");
  const inQuick = quick.contains(segDrag.el);
  segDrag = null;
  save(true);
  // released outside the quick panel: let the hover logic decide whether to close
  if (inQuick && !quick.matches(":hover")) scheduleClose();
}
document.addEventListener("pointerup", endSegDrag);
document.addEventListener("pointercancel", endSegDrag);
document.addEventListener("keydown", e => {
  const el = e.target.closest && e.target.closest(".segbar");
  if (!el) return;
  const kind = el.dataset.kind, id = el.dataset.id;
  const step = kind === "stock" ? 1 / numbers(id).cap : 0.05;
  const v = barValue(kind, id);
  const map = { ArrowRight: v + step, ArrowUp: v + step, ArrowLeft: v - step, ArrowDown: v - step, Home: 0, End: 1 };
  if (e.key in map) { e.preventDefault(); setBar(kind, id, map[e.key]); save(true); }
});
// after any manual change: no alert for it, refresh everything that shows this business

}

function bindWin(id) {
  const b = S.biz[id], $ = s => win.querySelector(s);
  const changed = (full = true) => { syncStatus(); save(true); if (full) renderWin(); renderAll(); };
  $("#wClose").onclick = closeWin;
  $("#wOwned").onchange = e => { b.owned = e.target.checked; if (!b.owned) b.pin = b.pin || null; changed(); renderPins(); };
  if ($("#wPin")) $("#wPin").onclick = () => startPlacing(id);
  if ($("#wPinDel")) $("#wPinDel").onclick = () => { b.pin = null; changed(); renderPins(); };
  if (!defOf(id).production) {
    if (!b.owned) return;
    bindClub(win, renderWin);
    const num = (sel, obj, key) => $(sel).onchange = e => { const v = parseFloat(e.target.value); if (v > 0) { obj[key] = v; obj.fired = {}; save(true); renderAll(); liveWin(); } };
    num("#cBarCd", b.bar, "cdMin"); num("#cBarSt", b.bar, "stockMin"); num("#cShopCd", b.shop, "cdMin");
    const money0 = (sel, key) => $(sel).onchange = e => { const v = parseFloat(e.target.value); if (v >= 0) { settleBar(); b.bar[key] = v; if (key === "cap") b.bar.bag = Math.min(b.bar.bag, v); save(true); renderAll(); liveWin(); } };
    money0("#cPay", "payout"); money0("#cCap", "cap"); money0("#cBag", "bag");
    // fix a wrong time: "resupplied N minutes ago" (empty = never)
    const ago = (sel, obj) => { const el = $(sel); if (el) el.onchange = e => {
      const v = e.target.value.trim();
      obj.prev = obj.last;
      if (obj === b.bar) settleBar();
      obj.last = v === "" ? null : Date.now() - Math.max(0, parseFloat(v) || 0) * 60000;
      if (obj === b.bar) b.bar.paidTo = Date.now();   // earnings already in the bag stay as they are
      const bi = obj === b.bar ? barInfo() : shopInfo();
      obj.fired = { ready: bi.cd === 0, low: obj === b.bar && bi.stock <= 15, empty: obj === b.bar && bi.stock === 0 };
      b.alert = null;
      save(true); renderAll(); liveWin();
    }; };
    ago("#cBarAgo", b.bar); ago("#cShopAgo", b.shop);
    liveClub(win, "w");
    return;
  }
  if (!b.owned) return;
  $("#wEquip").onclick = () => { b.equip = !b.equip; changed(); };
  $("#wStaff").onclick = () => { b.staff = !b.staff; changed(); };
  $("#wResupply").onclick = () => { b.supplies = 1; ackAlerts(id); changed(); };
  $("#wSold").onclick = () => { b.stock = 0; ackAlerts(id); changed(); };
  $("#wAlert").onchange = e => { b.alertMin = Math.max(1, Math.min(240, +e.target.value || 15)); changed(); };
  const ov = (sel, key) => $(sel).onchange = e => { const v = parseFloat(e.target.value); if (v > 0) b.over[key] = v; else delete b.over[key]; changed(); };
  ov("#oMpu", "mpu"); ov("#oUpb", "upb"); ov("#oVal", "value");
  $("#oReset").onclick = () => { b.over = {}; changed(); };
}
