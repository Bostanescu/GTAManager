/* ======================================================================
   Segment bars (supplies & stock), shared by the quick panel and the window
   Stock snaps to whole units, like the game; supplies snap to quarter boxes.
   ====================================================================== */
function barValue(kind, id) {
  const b = S.biz[id];
  return kind === "stock" ? Math.min(1, b.stock / numbers(id).cap) : b.supplies;
}
function barTicks(kind, id) {
  if (kind === "supplies") return 4;
  const per = numbers(id).cap / 5;           // units in one box: coke 2, meth 4, cash 8, docs 12, weed 16
  return per <= 8 ? per : 4;                 // too many lines get noisy: show quarters
}
function segBarHtml(kind, id, extra = "") {
  const label = t(kind === "stock" ? "stock" : "supplies");
  return `<div class="segbar ${kind} ${extra}" data-kind="${kind}" data-id="${id}" role="slider" tabindex="0" aria-label="${label}">
    ${[0, 1, 2, 3, 4].map(() => `<div class="seg" style="--ticks:${barTicks(kind, id)}"><i></i></div>`).join("")}
  </div>`;
}
function updateSegBar(el) {
  const kind = el.dataset.kind, id = el.dataset.id, v = barValue(kind, id);
  el.querySelectorAll(".seg i").forEach((i, k) => { i.style.width = Math.max(0, Math.min(1, v * 5 - k)) * 100 + "%"; });
  if (kind === "supplies") {
    const st = status(id);
    el.classList.toggle("low", st === "low");
    el.classList.toggle("empty", S.biz[id].supplies <= 0);
  }
  const b = S.biz[id];
  el.setAttribute("aria-valuemin", 0);
  el.setAttribute("aria-valuemax", kind === "stock" ? numbers(id).cap : 100);
  el.setAttribute("aria-valuenow", kind === "stock" ? Math.floor(b.stock + 1e-6) : Math.round(b.supplies * 100));
}
function setBar(kind, id, v) {
  const b = S.biz[id];
  v = Math.max(0, Math.min(1, v));
  if (kind === "stock") b.stock = Math.round(v * numbers(id).cap);
  else b.supplies = Math.round(v * 20) / 20;
  afterEdit(false);
}
// pointer x -> 0..1 across the 5 boxes (the gaps belong to the box on their left)
function barFromX(el, x) {
  const segs = [...el.querySelectorAll(".seg")];
  for (let k = 0; k < segs.length; k++) {
    const r = segs[k].getBoundingClientRect();
    const next = segs[k + 1] ? segs[k + 1].getBoundingClientRect().left : r.right;
    if (x < next || k === segs.length - 1) {
      const f = Math.max(0, Math.min(1, (x - r.left) / r.width));
      return (k + f) / 5;
    }
  }
  return 0;
}
let segDrag = null;
document.addEventListener("pointerdown", e => {
  const el = e.target.closest(".segbar");
  if (!el || (e.pointerType === "mouse" && e.button !== 0)) return;
  e.preventDefault();
  el.setPointerCapture(e.pointerId);
  el.classList.add("dragging");
  segDrag = { el, pid: e.pointerId };
  setBar(el.dataset.kind, el.dataset.id, barFromX(el, e.clientX));
});
document.addEventListener("pointermove", e => {
  if (!segDrag || e.pointerId !== segDrag.pid) return;
  setBar(segDrag.el.dataset.kind, segDrag.el.dataset.id, barFromX(segDrag.el, e.clientX));
});
function endSegDrag(e) {
  if (!segDrag || e.pointerId !== segDrag.pid) return;
  segDrag.el.classList.remove("dragging");
  const inQuick = quick.contains(segDrag.el);
  segDrag = null;
  save(true);
  // released outside the quick panel: let the hover logic decide whether to close
  if (inQuick && !quick.matches(":hover")) scheduleClose();
}
document.addEventListener("pointerup", endSegDrag);
document.addEventListener("pointercancel", endSegDrag);
document.addEventListener("keydown", e => {
  const el = e.target.closest && e.target.closest(".segbar");
  if (!el) return;
  const kind = el.dataset.kind, id = el.dataset.id;
  const step = kind === "stock" ? 1 / numbers(id).cap : 0.05;
  const v = barValue(kind, id);
  const map = { ArrowRight: v + step, ArrowUp: v + step, ArrowLeft: v - step, ArrowDown: v - step, Home: 0, End: 1 };
  if (e.key in map) { e.preventDefault(); setBar(kind, id, map[e.key]); save(true); }
});

function bindWin(id) {
  const b = S.biz[id], $ = s => win.querySelector(s);
  const changed = (full = true) => { syncStatus(); save(true); if (full) renderWin(); renderAll(); };
  $("#wClose").onclick = closeWin;
  $("#wOwned").onchange = e => { b.owned = e.target.checked; if (!b.owned) b.pin = b.pin || null; changed(); renderPins(); };
  if ($("#wPin")) $("#wPin").onclick = () => startPlacing(id);
  if ($("#wPinDel")) $("#wPinDel").onclick = () => { b.pin = null; changed(); renderPins(); };
  if (!defOf(id).production) {
    if (!b.owned) return;
    bindClub(win, renderWin);
    const num = (sel, obj, key) => $(sel).onchange = e => { const v = parseFloat(e.target.value); if (v > 0) { obj[key] = v; obj.fired = {}; save(true); renderAll(); liveWin(); } };
    num("#cBarCd", b.bar, "cdMin"); num("#cBarSt", b.bar, "stockMin"); num("#cShopCd", b.shop, "cdMin");
    const money0 = (sel, key) => $(sel).onchange = e => { const v = parseFloat(e.target.value); if (v >= 0) { settleBar(); b.bar[key] = v; if (key === "cap") b.bar.bag = Math.min(b.bar.bag, v); save(true); renderAll(); liveWin(); } };
    money0("#cPay", "payout"); money0("#cCap", "cap"); money0("#cBag", "bag");
    // fix a wrong time: "resupplied N minutes ago" (empty = never)
    const ago = (sel, obj) => { const el = $(sel); if (el) el.onchange = e => {
      const v = e.target.value.trim();
      obj.prev = obj.last;
      if (obj === b.bar) settleBar();
      obj.last = v === "" ? null : Date.now() - Math.max(0, parseFloat(v) || 0) * 60000;
      if (obj === b.bar) b.bar.paidTo = Date.now();   // earnings already in the bag stay as they are
      const bi = obj === b.bar ? barInfo() : shopInfo();
      obj.fired = { ready: bi.cd === 0, low: obj === b.bar && bi.stock <= 15, empty: obj === b.bar && bi.stock === 0 };
      b.alert = null;
      save(true); renderAll(); liveWin();
    }; };
    ago("#cBarAgo", b.bar); ago("#cShopAgo", b.shop);
    liveClub(win, "w");
    return;
  }
  if (!b.owned) return;
  $("#wEquip").onclick = () => { b.equip = !b.equip; changed(); };
  $("#wStaff").onclick = () => { b.staff = !b.staff; changed(); };
  $("#wResupply").onclick = () => { b.supplies = 1; ackAlerts(id); changed(); };
  $("#wSold").onclick = () => { b.stock = 0; ackAlerts(id); changed(); };
  $("#wAlert").onchange = e => { b.alertMin = Math.max(1, Math.min(240, +e.target.value || 15)); changed(); };
  const ov = (sel, key) => $(sel).onchange = e => { const v = parseFloat(e.target.value); if (v > 0) b.over[key] = v; else delete b.over[key]; changed(); };
  ov("#oMpu", "mpu"); ov("#oUpb", "upb"); ov("#oVal", "value");
  $("#oReset").onclick = () => { b.over = {}; changed(); };
}

/* ======================================================================
   Drag to reorder (category tiles and the businesses in the fly-out)
   Mouse: press and drag up/down. Touch: hold briefly, then drag.
   Keyboard: Alt + Arrow Up/Down on a focused item.
   ====================================================================== */
let sortState = null, sortEndedAt = 0;
const justSorted = () => performance.now() - sortEndedAt < 250;

function makeSortable(container, itemSel, { onStart, onDrop, scroller }) {
  const items = () => [...container.querySelectorAll(itemSel)];
  // FLIP: animate siblings from where they were to where they are now
  function flip(before) {
    items().forEach(el => {
      if (el === sortState.el) return;
      const old = before.get(el);
      if (old == null) return;
      const dy = old - el.getBoundingClientRect().top;
      if (!dy) return;
      el.style.transition = "none";
      el.style.transform = `translateY(${dy}px)`;
      el.getBoundingClientRect();
      el.style.transition = "";
      el.style.transform = "";
    });
  }
  function begin(e) {
    const st = sortState;
    st.started = true;
    st.el.classList.add("sorting");
    container.classList.add("sorting-active");
    st.el.setPointerCapture(st.pid);
    if (navigator.vibrate && st.touch) navigator.vibrate(15);
    onStart && onStart();
  }
  container.addEventListener("pointerdown", e => {
    const el = e.target.closest(itemSel);
    if (!el || !container.contains(el) || (e.pointerType === "mouse" && e.button !== 0)) return;
    if (e.target.closest(".segbar, input, select")) return;
    sortState = { el, pid: e.pointerId, y0: e.clientY, x0: e.clientX, started: false, touch: e.pointerType !== "mouse", container };
    if (sortState.touch) sortState.timer = setTimeout(() => sortState && begin(), 380);
  });
  container.addEventListener("pointermove", e => {
    const st = sortState;
    if (!st || st.container !== container || e.pointerId !== st.pid) return;
    if (!st.started) {
      const moved = Math.hypot(e.clientX - st.x0, e.clientY - st.y0);
      if (st.touch) { if (moved > 10) { clearTimeout(st.timer); sortState = null; } return; }   // finger moved: it's a scroll
      if (Math.abs(e.clientY - st.y0) > 6) begin(e); else return;
    }
    e.preventDefault();
    st.lastY = e.clientY;
    const el = st.el;
    // where the dragged item's middle is now
    el.style.transform = `translateY(${e.clientY - st.y0}px)`;
    const r = el.getBoundingClientRect(), mid = r.top + r.height / 2;
    const list = items(), idx = list.indexOf(el);
    let target = null, after = false;
    const prev = list[idx - 1], next = list[idx + 1];
    if (prev) { const pr = prev.getBoundingClientRect(); if (mid < pr.top + pr.height / 2) target = prev; }
    if (!target && next) { const nr = next.getBoundingClientRect(); if (mid > nr.top + nr.height / 2) { target = next; after = true; } }
    if (target) {
      const before = new Map(list.map(x => [x, x.getBoundingClientRect().top]));
      const topBefore = el.offsetTop;
      if (after) target.after(el); else target.before(el);
      st.y0 += el.offsetTop - topBefore;      // keep it under the pointer after the DOM move
      el.style.transform = `translateY(${e.clientY - st.y0}px)`;
      flip(before);
    }
    // scroll the list when dragging near its edges
    if (scroller) {
      const sr = scroller.getBoundingClientRect();
      if (e.clientY < sr.top + 40) scroller.scrollTop -= 12;
      else if (e.clientY > sr.bottom - 40) scroller.scrollTop += 12;
    }
  });
  const end = e => {
    const st = sortState;
    if (!st || st.container !== container || e.pointerId !== st.pid) return;
    clearTimeout(st.timer);
    sortState = null;
    if (!st.started) return;
    const el = st.el;
    el.classList.remove("sorting");
    el.classList.add("settling");
    el.style.transform = "";
    setTimeout(() => el.classList.remove("settling"), 220);
    container.classList.remove("sorting-active");
    sortEndedAt = performance.now();
    onDrop(items().map(x => x.dataset.cat || x.dataset.id));
  };
  container.addEventListener("pointerup", end);
  container.addEventListener("pointercancel", end);
  // block page scrolling while a touch drag is active
  container.addEventListener("touchmove", e => { if (sortState && sortState.started) e.preventDefault(); }, { passive: false });
  container.addEventListener("contextmenu", e => { if (sortState) e.preventDefault(); });
  // keyboard
  container.addEventListener("keydown", e => {
    if (!e.altKey || (e.key !== "ArrowUp" && e.key !== "ArrowDown")) return;
    const el = e.target.closest(itemSel);
    if (!el) return;
    e.preventDefault();
    const sib = e.key === "ArrowUp" ? el.previousElementSibling : el.nextElementSibling;
    if (!sib) return;
    if (e.key === "ArrowUp") sib.before(el); else sib.after(el);
    el.focus();
    onDrop(items().map(x => x.dataset.cat || x.dataset.id));
  });
}

function renderThemePicker(keepInputs) {
  const grid = document.getElementById("themeGrid");
  grid.innerHTML = "";
  for (const [id, t] of Object.entries(THEMES)) {
    const b = document.createElement("button");
    b.className = "theme-tile" + (themeCfg.id === id ? " active" : "");
    b.style.background = t.bg;
    b.style.setProperty("--tile-bg", t.bg);
    b.style.color = t.text;
    b.title = t.name;
    b.innerHTML = `<span class="tile-name" style="font-family:'${t.font}',sans-serif;color:${t.title}">${t.name}</span>
      <span class="tile-dots"><i style="background:${t.bg2};outline:1px solid ${t.border}"></i><i style="background:${t.accent}"></i><i style="background:${t.ok}"></i><i style="background:${t.bad}"></i></span>`;
    b.onclick = (ev) => { ev.stopPropagation(); setTheme(id); };
    grid.appendChild(b);
  }
  if (!keepInputs) {
    const cur = themeTokens(themeCfg);
    document.getElementById("customBg").value = themeCfg.id === "custom" ? themeCfg.bg : cur.bg;
    document.getElementById("customAccent").value = themeCfg.id === "custom" ? themeCfg.accent : cur.accent;
    const fs = document.getElementById("customFont");

      THEME_FONTS.forEach(f => {
        const o = document.createElement("option");
        o.value = f; o.textContent = f; o.style.fontFamily = `'${f}'`;

      });
    }
    fs.value = cur.font;
  }
}

const bellBtn = document.getElementById("bellBtn"), bellWrap = document.getElementById("bellWrap");
const notesPanel = document.getElementById("notesPanel"), noteStack = document.getElementById("noteStack");
function bizIcon(id) { return id ? ICON[defOf(id).icon] : ""; }
function showNote(n) {
  if (bellWrap.classList.contains("open")) { renderNotesPanel(); return; }
  const el = document.createElement("div");
  el.className = `note k-${n.kind}`;
  el.innerHTML = `${n.biz ? `<span class="ico">${bizIcon(n.biz)}</span>` : ""}<span>${escapeHtml(n.msg)}</span>`;
  el.onclick = () => { markRead(n.id); if (n.biz) openWin(n.biz); el.remove(); };
  noteStack.prepend(el);
  while (noteStack.children.length > 4) noteStack.lastChild.remove();
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("show")));
  // stay a few seconds (longer while hovered), then fade out
  let left = 6500, last = performance.now(), hovered = false;
  el.onmouseenter = () => hovered = true;
  el.onmouseleave = () => { hovered = false; last = performance.now(); };
  const iv = setInterval(() => {
    const now = performance.now();
    if (!hovered) left -= now - last;
    last = now;
    if (left <= 0) {
      clearInterval(iv);
      el.classList.remove("show");
      setTimeout(() => el.remove(), 550);
    }
  }, 200);
}
function renderBell() {
  const unread = S.notes.filter(n => !n.read).length;
  bellBtn.classList.toggle("unread", unread > 0);
  bellBtn.setAttribute("aria-label", unread ? `${t("notifications")}: ${unread}` : t("notifications"));

}
function renderNotesPanel() {
  const items = S.notes.map(n => {
    const m = Math.floor((Date.now() - n.at) / 60000);
    return `<div class="nitem k-${n.kind} ${n.read ? "" : "unread"}" data-id="${n.id}" data-biz="${n.biz || ""}">
      <span class="nbar"></span><span><span class="ntext">${escapeHtml(n.msg)}</span><small>${t("ago", m)}</small></span></div>`;
  }).join("");
  notesPanel.innerHTML = `<div class="notes-head"><b>${t("notifications")}</b><button id="nRead">${t("markRead")}</button><button id="nClear">${t("clearAll")}</button></div>

  notesPanel.querySelector("#nRead").onclick = e => { e.stopPropagation(); S.notes.forEach(n => n.read = true); save(); renderBell(); renderNotesPanel(); };
  notesPanel.querySelector("#nClear").onclick = e => { e.stopPropagation(); S.notes = []; save(); renderBell(); renderNotesPanel(); };

function escapeHtml(x) { return String(x).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }

let toastTimer = null;
function toast(msg, action) {
  const el = document.getElementById("toast");

  const btn = document.getElementById("toastAct");
  btn.hidden = !action;
  if (action) {

  }
  el.classList.add("show");

}

const modal = document.getElementById("modal");
function openModal(title, html) {
  document.getElementById("modalTitle").textContent = title;
  const body = document.getElementById("modalBody");
  body.innerHTML = html;
  body.scrollTop = 0;
  // in-page links scroll inside the dialog
  body.querySelectorAll('a[href^="#"]').forEach(a => a.onclick = e => {
    e.preventDefault();
    body.querySelector(a.getAttribute("href"))?.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  menu.classList.remove("open");
  if (!modal.open) modal.showModal();
  body.scrollTop = 0;             // always start at the top
}
document.getElementById("modalClose").onclick = () => modal.close();
modal.addEventListener("click", e => { if (e.target === modal) modal.close(); });
document.getElementById("helpBtn").onclick = () => openModal(t("helpTitle"), HELP[lang] || HELP.en);
document.getElementById("aboutBtn").onclick = () => {
  const ro = lang === "ro";
  const intro = ro
    ? `<p>Production Manager ține evidența afacerilor tale din GTA Online pe hartă: provizii, stoc, valoare și timere, cu alerte. Proiect personal, gratuit, fără reclame și fără nicio legătură cu jocul: totul se introduce manual.</p>`
    : `<p>Production Manager keeps track of your GTA Online businesses on the map: supplies, stock, value and timers, with alerts. A free personal project with no ads and no connection to the game itself: everything is entered by hand.</p>`;
  const log = CHANGELOG.map(e => `<div class="log-entry"><h4>v${e.v}<small>${e.date}</small></h4><ul>${(ro ? e.ro : e.en).map(x => `<li>${x}</li>`).join("")}</ul></div>`).join("");
  openModal(t("aboutTitle"), `${intro}<p class="version">${ro ? "Versiunea" : "Version"} ${APP_VERSION}</p><h3>${ro ? "Istoricul schimbărilor" : "Changelog"}</h3><div class="log">${log}</div>`);
};

function boot() {
  syncStatus();
  renderBell();
  optSound.checked = S.sound;
  optNotify.checked = S.notify;
  document.body.classList.toggle("side-closed", !S.sideOpen);
  closeWin();
  applyLang();
}
load();
if (matchMedia("(max-width: 760px)").matches) S.sideOpen = false;
// time passed while the page was closed: only count it if the player says so
if (S.inGame) {
  const away = (Date.now() - S.lastTick) / 60000;
  if (away > 5 && !confirm(t("awayAsk", fmtTime(away)))) S.lastTick = Date.now();
}
boot();
syncStatus();
tick();
setInterval(tick, 1000);
window.addEventListener("beforeunload", () => { S.lastTick = Date.now(); save(true); });
</script>
