function liveWin() {
  if (openId && !defOf(openId).production && S.biz[openId].owned) { liveClub(win, "w"); return; }
  if (!openId || !defOf(openId).production || !S.biz[openId].owned) return;
  const id = openId, b = S.biz[id], n = numbers(id), f = forecast(id), st = status(id);
  const q = s => win.querySelector(s);
  if (!q("#wState")) return;
  q("#wState").className = `state-badge st-${st}`;
  q("#wState").textContent = t("st_" + st);
  win.querySelectorAll(".segbar").forEach(updateSegBar);
  q("#wSupplyHint").textContent = b.supplies > 0 && f.suppliesOutFirst ? t("suppliesLeft", fmtTime(f.minToEmpty)) : b.supplies <= 0 ? t("suppliesStop") : "";
  q("#wStockNum").textContent = t("stockOf", [Math.floor(b.stock + 1e-6), n.cap]);
  q("#wStockHint").textContent = b.stock >= n.cap ? t("st_full") : isFinite(f.minToFull) ? t("toFull", fmtTime(f.minToFull)) : t("needsSupplies");
  const units = Math.floor(b.stock + 1e-6);
  q("#wValue").innerHTML = `<span>${t("local")}</span><b>${money(units * n.value)}</b><span>${t("far")}</span><b>${money(units * n.value * FAR_BONUS)}</b>`;
}

function renderHead() {
  const ig = document.getElementById("ingame");
  ig.classList.toggle("on", S.inGame);
  ig.setAttribute("aria-checked", S.inGame);
  document.getElementById("ingameSub").textContent = S.inGame ? t("ingameOn") : t("ingameOff");
  let total = 0, next = null;
  MC.filter(d => d.production).forEach(d => {
    const b = S.biz[d.id];
    if (!b.owned) return;
    const n = numbers(d.id);
    total += Math.floor(b.stock + 1e-6) * n.value;
    const f = forecast(d.id), st = status(d.id);
    if (st === "full" || st === "empty") return;
    const lowIn = f.suppliesOutFirst ? f.minToEmpty - b.alertMin : Infinity;
    const cand = Math.max(0, Math.min(lowIn, f.minToFull));
    if (isFinite(cand) && (!next || cand < next.m)) next = { m: cand, id: d.id };
  });
  const c = S.biz.club;
  if (c.owned && c.bar.last && c.bar.remind) { const m = barInfo().cd; if (m > 0 && (!next || m < next.m)) next = { m, id: "club" }; }
  if (c.owned && c.shop.has && c.shop.last && c.shop.remind) { const m = shopInfo().cd; if (m > 0 && (!next || m < next.m)) next = { m, id: "club" }; }
  document.getElementById("headStat").innerHTML =
    `<b>${money(total)}</b><small>${next ? `${t("nextEvent")}: ${bizName(next.id)} ${fmtTime(next.m)}` : t("nothingSoon")}</small>`;
}

/* bell + notification cards */
const bellBtn = document.getElementById("bellBtn"), bellWrap = document.getElementById("bellWrap");
const notesPanel = document.getElementById("notesPanel"), noteStack = document.getElementById("noteStack");
function bizIcon(id) { return id ? ICON[defOf(id).icon] : ""; }
function showNote(n) {
  if (bellWrap.classList.contains("open")) { renderNotesPanel(); return; }
  const el = document.createElement("div");
  el.className = `note k-${n.kind}`;
  el.innerHTML = `${n.biz ? `<span class="ico">${bizIcon(n.biz)}</span>` : ""}<span>${escapeHtml(n.msg)}</span>`;
  el.onclick = () => { markRead(n.id); if (n.biz) openWin(n.biz); el.remove(); };
  noteStack.prepend(el);
  while (noteStack.children.length > 4) noteStack.lastChild.remove();
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("show")));
  // stay a few seconds (longer while hovered), then fade out
  let left = 6500, last = performance.now(), hovered = false;
  el.onmouseenter = () => hovered = true;
  el.onmouseleave = () => { hovered = false; last = performance.now(); };
  const iv = setInterval(() => {
    const now = performance.now();
    if (!hovered) left -= now - last;
    last = now;
    if (left <= 0) {
      clearInterval(iv);
      el.classList.remove("show");
      setTimeout(() => el.remove(), 550);
    }
  }, 200);
}
function renderBell() {
  const unread = S.notes.filter(n => !n.read).length;
  bellBtn.classList.toggle("unread", unread > 0);
  bellBtn.setAttribute("aria-label", unread ? `${t("notifications")}: ${unread}` : t("notifications"));
  if (bellWrap.classList.contains("open")) renderNotesPanel();
}
function renderNotesPanel() {
  const items = S.notes.map(n => {
    const m = Math.floor((Date.now() - n.at) / 60000);
    return `<div class="nitem k-${n.kind} ${n.read ? "" : "unread"}" data-id="${n.id}" data-biz="${n.biz || ""}">
      <span class="nbar"></span><span><span class="ntext">${escapeHtml(n.msg)}</span><small>${t("ago", m)}</small></span></div>`;
  }).join("");
  notesPanel.innerHTML = `<div class="notes-head"><b>${t("notifications")}</b><button id="nRead">${t("markRead")}</button><button id="nClear">${t("clearAll")}</button></div>
    ${items || `<div class="notes-empty">${t("noNotes")}</div>`}`;
  notesPanel.querySelector("#nRead").onclick = e => { e.stopPropagation(); S.notes.forEach(n => n.read = true); save(); renderBell(); renderNotesPanel(); };
  notesPanel.querySelector("#nClear").onclick = e => { e.stopPropagation(); S.notes = []; save(); renderBell(); renderNotesPanel(); };
  notesPanel.querySelectorAll(".nitem").forEach(it => it.onclick = () => {
    markRead(+it.dataset.id);
    bellWrap.classList.remove("open");
    if (it.dataset.biz) openWin(it.dataset.biz);
  });
}
function markRead(id) {
  const n = S.notes.find(x => x.id === id);
  if (n) n.read = true;
  save();
  renderBell();
}
bellBtn.onclick = e => {
  e.stopPropagation();
  menu.classList.remove("open");
  const open = bellWrap.classList.toggle("open");
  if (open) {
    renderNotesPanel();
    noteStack.innerHTML = "";        // the list already shows them
  }
};
document.addEventListener("click", e => { if (!e.target.closest("#bellWrap")) bellWrap.classList.remove("open"); });
function escapeHtml(x) { return String(x).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }

let toastTimer = null;
function toast(msg, action) {
  const el = document.getElementById("toast");
  document.getElementById("toastText").textContent = msg;
  const btn = document.getElementById("toastAct");
  btn.hidden = !action;
  if (action) {
    btn.textContent = action.label;
    btn.onclick = () => { el.classList.remove("show"); action.run(); };
  }
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), action ? 7000 : 4000);
}

function applyLang() {
  document.documentElement.lang = lang;
  document.getElementById("langSel").value = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
  document.querySelectorAll("[data-i18n-title]").forEach(el => el.title = t(el.dataset.i18nTitle));
  if (modal.open) modal.close();     // reopen to see Help/About in the new language
  renderTiles();
  renderPins();
  renderLive();
  renderWin();
}

    <li><b>Pinurile</b>: click deschide afacerea, tragerea o mută. Inelul arată stocul, căsuțele mici de dedesubt arată proviziile. Un inel care pulsează înseamnă o alertă nevăzută.</li>
    <li><b>Plasarea</b>: o previzualizare urmărește cursorul. Click ca s-o pui; <kbd>Esc</kbd> sau click dreapta anulează.</li>
  </ul>
  <h3 id="h-club">Clubhouse: barul și Bike Shop</h3>
  <ul>
    <li><b>🔔 Am aprovizionat barul</b> pornește două timere: când poți aproviziona din nou (48 min) și cât mai ține marfa (aprox. 3 h 12 min).</li>
    <li>L-ai apăsat din greșeală? Folosește <b>Anulează</b> (în mesajul de jos sau sub buton) ori <b>Nu am aprovizionat</b>. În fereastra mare poți scrie și acum câte minute s-a întâmplat.</li>
    <li>Bifează <b>Am Custom Bike Shop</b>, apoi <b>Motocicletă livrată</b> după fiecare livrare, ca să pornească cooldown-ul.</li>
    <li>🔔 mic de lângă fiecare titlu pornește sau oprește memento-ul. Aceste timere merg în timp real, chiar și cu „În joc” oprit.</li>
    <li><b>Câștigul barului</b>: cât timp barul are marfă, în sacul din biroul clubului intră $5,000 o dată pe zi din joc (48 min), începând chiar cu livrarea, deci aprox. $25,000 pe aprovizionare. Sacul ține maxim $100,000 și se umple și când ești offline. Apasă <b>Am colectat</b> după ce îl iei în joc. Primești alertă când sacul e plin.</li>
    <li>Câștigul pe zi, limita sacului și suma din sac acum se pot ajusta în fereastra mare, la <b>Setări timere</b>.</li>
  </ul>
  <h3 id="h-notes">Notificări</h3>
  <ul>
    <li>Cardurile apar în dreapta sus câteva secunde, apoi dispar treptat. Click pe unul deschide afacerea.</li>
    <li>Ești anunțat când proviziile sunt pe terminate, s-au terminat, stocul e aproape plin, stocul e plin și când se termină cooldown-ul barului sau al Bike Shop-ului.</li>
    <li>Clopoțelul păstrează istoricul; un punct portocaliu mic înseamnă ceva necitit.</li>
    <li>Din meniul ⋮ poți opri sunetul, testa sunetul și porni notificări pe desktop pentru când tab-ul e în fundal. Browserele permit sunetul doar după ce ai dat un click pe pagină.</li>
  </ul>
  <h3 id="h-data">Datele tale</h3>
  <ul>
    <li>Totul se salvează doar în acest browser (afaceri, pinuri, timere, notificări, limbă). Alt browser sau alt dispozitiv pornește gol, în engleză.</li>
    <li>Folosește <b>Export Production.json</b> ca backup și <b>Import</b> ca să le aduci înapoi sau pe alt dispozitiv. Importul înlocuiește tot din pagină.</li>
  </ul>`
};

const modal = document.getElementById("modal");
function openModal(title, html) {
  document.getElementById("modalTitle").textContent = title;
  const body = document.getElementById("modalBody");
  body.innerHTML = html;
  body.scrollTop = 0;
  // in-page links scroll inside the dialog
  body.querySelectorAll('a[href^="#"]').forEach(a => a.onclick = e => {
    e.preventDefault();
    body.querySelector(a.getAttribute("href"))?.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  menu.classList.remove("open");
  if (!modal.open) modal.showModal();
  body.scrollTop = 0;             // always start at the top
}
document.getElementById("modalClose").onclick = () => modal.close();
modal.addEventListener("click", e => { if (e.target === modal) modal.close(); });
document.getElementById("helpBtn").onclick = () => openModal(t("helpTitle"), HELP[lang] || HELP.en);
document.getElementById("aboutBtn").onclick = () => {
  const ro = lang === "ro";
  const intro = ro
    ? `<p>Production Manager ține evidența afacerilor tale din GTA Online pe hartă: provizii, stoc, valoare și timere, cu alerte. Proiect personal, gratuit, fără reclame și fără nicio legătură cu jocul: totul se introduce manual.</p>`
    : `<p>Production Manager keeps track of your GTA Online businesses on the map: supplies, stock, value and timers, with alerts. A free personal project with no ads and no connection to the game itself: everything is entered by hand.</p>`;
  const log = CHANGELOG.map(e => `<div class="log-entry"><h4>v${e.v}<small>${e.date}</small></h4><ul>${(ro ? e.ro : e.en).map(x => `<li>${x}</li>`).join("")}</ul></div>`).join("");
  openModal(t("aboutTitle"), `${intro}<p class="version">${ro ? "Versiunea" : "Version"} ${APP_VERSION}</p><h3>${ro ? "Istoricul schimbărilor" : "Changelog"}</h3><div class="log">${log}</div>`);
};

function boot() {
  syncStatus();
  renderBell();
  optSound.checked = S.sound;
  optNotify.checked = S.notify;
  document.body.classList.toggle("side-closed", !S.sideOpen);
  closeWin();
  applyLang();
}
load();
if (matchMedia("(max-width: 760px)").matches) S.sideOpen = false;
// time passed while the page was closed: only count it if the player says so
if (S.inGame) {
  const away = (Date.now() - S.lastTick) / 60000;
  if (away > 5 && !confirm(t("awayAsk", fmtTime(away)))) S.lastTick = Date.now();
}
boot();
syncStatus();
tick();
setInterval(tick, 1000);
window.addEventListener("beforeunload", () => { S.lastTick = Date.now(); save(true); });
</script>
